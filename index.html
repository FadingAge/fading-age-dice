<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fading Age Würfel</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; }
  body { margin: 0; padding: 10px; background: #1e2231; color: #e8e6e3; font-size: 14px; }
  #tray { width: 100%; height: 210px; display: block; border-radius: 10px;
    background: radial-gradient(ellipse at center, #3a2f22 0%, #241d15 100%); }
  .slot { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .slot input[type=color] { width: 44px; height: 32px; padding: 0; border: 1px solid #444a63;
    border-radius: 6px; background: none; cursor: pointer; }
  input[type=number] { width: 64px; box-sizing: border-box; padding: 6px; border-radius: 6px;
    border: 1px solid #444a63; background: #2a2f45; color: inherit; }
  .opts { display: flex; gap: 8px; margin-top: 8px; }
  .opts label { flex: 1; font-size: 12px; opacity: .85; }
  .opts input { width: 100%; margin-top: 2px; }
  .check { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 13px; }
  button { width: 100%; margin-top: 10px; padding: 10px; border: 0; border-radius: 8px;
    background: #b8893c; color: #1a1408; font-weight: 700; font-size: 15px; cursor: pointer; }
  button:hover { background: #cc9a48; }
  #log { margin-top: 10px; max-height: 150px; overflow-y: auto; }
  .entry { padding: 6px 8px; margin-bottom: 6px; background: #2a2f45; border-radius: 6px; }
  .chip { display: inline-block; padding: 1px 7px; margin: 3px 4px 0 0; border-radius: 10px;
    font-size: 12px; font-weight: 700; }
  .hit { color: #8fd694; font-weight: 700; }
</style>
</head>
<body>
  <canvas id="tray"></canvas>

  <div class="slot"><input type="color" id="c0" value="#d4a548"><input type="number" id="n0" min="0" max="10" value="3"><span>Würfel</span></div>
  <div class="slot"><input type="color" id="c1" value="#b83a3a"><input type="number" id="n1" min="0" max="10" value="0"><span>Würfel</span></div>
  <div class="slot"><input type="color" id="c2" value="#3a6fb8"><input type="number" id="n2" min="0" max="10" value="0"><span>Würfel</span></div>

  <div class="opts">
    <label>Modifikator<input type="number" id="mod" value="0"></label>
    <label>Erfolg ab (0 = aus)<input type="number" id="thr" min="0" max="6" value="0"></label>
  </div>
  <div class="check"><input id="hidden" type="checkbox"><span>Verdeckt (nur ich sehe das Ergebnis)</span></div>
  <button id="roll">Würfeln</button>
  <div id="log"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module">
  import OBR from "https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3/+esm";

  const CHANNEL = "de.fadingage.dice";
  const $ = (id) => document.getElementById(id);
  const safe = (h) => (/^#[0-9a-f]{6}$/i.test(h) ? h : "#888888");
  const lum = (h) => { const n = parseInt(h.slice(1), 16);
    return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255; };

  function randInt(max) {
    const limit = Math.floor(0x100000000 / max) * max, buf = new Uint32Array(1);
    do { crypto.getRandomValues(buf); } while (buf[0] >= limit);
    return (buf[0] % max) + 1;
  }

  // ---------- 3D-Würfel ----------
  // Materialreihenfolge von BoxGeometry: +x, -x, +y, -y, +z, -z (gegenüber ergibt immer 7)
  const FACES = [3, 4, 1, 6, 2, 5];
  const NORMALS = { 3: [1,0,0], 4: [-1,0,0], 1: [0,1,0], 6: [0,-1,0], 2: [0,0,1], 5: [0,0,-1] };
  const PIPS = { 1: [[1,1]], 2: [[0,0],[2,2]], 3: [[0,0],[1,1],[2,2]],
    4: [[0,0],[2,0],[0,2],[2,2]], 5: [[0,0],[2,0],[1,1],[0,2],[2,2]],
    6: [[0,0],[2,0],[0,1],[2,1],[0,2],[2,2]] };

  const matCache = {};
  function materials(hex) {
    if (matCache[hex]) return matCache[hex];
    const pip = lum(hex) > 0.55 ? "#1a1408" : "#f5efe0";
    return (matCache[hex] = FACES.map((v) => {
      const c = document.createElement("canvas"); c.width = c.height = 128;
      const g = c.getContext("2d");
      g.fillStyle = hex; g.fillRect(0, 0, 128, 128);
      g.strokeStyle = "rgba(0,0,0,.35)"; g.lineWidth = 8; g.strokeRect(0, 0, 128, 128);
      g.fillStyle = pip;
      PIPS[v].forEach(([x, y]) => { g.beginPath(); g.arc(32 * (x + 1), 32 * (y + 1), 9, 0, 7); g.fill(); });
      return new THREE.MeshStandardMaterial({ map: new THREE.CanvasTexture(c), roughness: 0.5 });
    }));
  }

  const canvas = $("tray");
  const W = canvas.clientWidth || 340, H = 210;
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(window.devicePixelRatio || 1);
  renderer.setSize(W, H, false);
  const scene = new THREE.Scene();
  scene.add(new THREE.AmbientLight(0xffffff, 0.8));
  const sun = new THREE.DirectionalLight(0xffffff, 0.9); sun.position.set(3, 8, 4); scene.add(sun);
  const camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 50);
  camera.position.set(0, 10, 4); camera.lookAt(0, 0, 0);
  const geo = new THREE.BoxGeometry(1, 1, 1);

  let meshes = [], t0 = 0;

  function showRoll(dice) {
    meshes.forEach((m) => scene.remove(m)); meshes = [];
    const n = dice.length, cols = Math.min(n, 6), rows = Math.ceil(n / cols);
    dice.forEach(([hex, v], i) => {
      const m = new THREE.Mesh(geo, materials(safe(hex)));
      const tx = ((i % cols) - (cols - 1) / 2) * 1.5;
      const tz = (Math.floor(i / cols) - (rows - 1) / 2) * 1.5;
      const qAlign = new THREE.Quaternion().setFromUnitVectors(
        new THREE.Vector3(...NORMALS[v]), new THREE.Vector3(0, 1, 0));
      const qYaw = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.random() * 6.28);
      m.userData = { tx, tz, sx: tx + (Math.random() - 0.5) * 3, sz: tz - 4,
        qEnd: qYaw.multiply(qAlign),
        axis: new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize(),
        turns: 2 + Math.random() * 2, delay: Math.random() * 150, bounce: 2 + Math.random() * 1.5 };
      scene.add(m); meshes.push(m);
    });
    t0 = performance.now();
    requestAnimationFrame(frame);
  }

  function frame(now) {
    let busy = false;
    meshes.forEach((m) => {
      const d = m.userData, t = Math.min(1, Math.max(0, (now - t0 - d.delay) / 1300));
      const e = 1 - Math.pow(1 - t, 3);
      if (t < 1) busy = true;
      m.position.set(d.sx + (d.tx - d.sx) * e,
        0.5 + (1 - e) * 3 + Math.abs(Math.sin(e * Math.PI * 2.5)) * (1 - e) * d.bounce,
        d.sz + (d.tz - d.sz) * e);
      const spin = new THREE.Quaternion().setFromAxisAngle(d.axis, (1 - e) * d.turns * Math.PI * 2);
      m.quaternion.copy(spin.multiply(d.qEnd));
    });
    renderer.render(scene, camera);
    if (busy) requestAnimationFrame(frame);
  }

  // ---------- Protokoll ----------
  function render(r) {
    const groups = {};
    r.dice.forEach(([h, v]) => (groups[safe(h)] ||= []).push(v));
    const chips = Object.entries(groups).map(([h, vs]) =>
      `<span class="chip" style="background:${h};color:${lum(h) > 0.55 ? "#1a1408" : "#f5efe0"}">${vs.join(" ")}</span>`).join("");
    const hits = r.threshold > 0 ? ` | <span class="hit">${r.successes} Erfolg${r.successes === 1 ? "" : "e"}</span>` : "";
    const mod = r.mod ? ` ${r.mod > 0 ? "+" : "-"} ${Math.abs(r.mod)}` : "";
    const div = document.createElement("div");
    div.className = "entry";
    div.innerHTML = `<div><b class="who"></b> würfelt ${r.dice.length}W6${mod}: <b>${r.total}</b>${hits}</div><div>${chips}</div>`;
    div.querySelector(".who").textContent = r.name;
    $("log").prepend(div);
    while ($("log").children.length > 15) $("log").lastChild.remove();
  }

  // ---------- Einstellungen merken ----------
  const FIELDS = ["c0","c1","c2","n0","n1","n2","mod","thr"];
  try { const s = JSON.parse(localStorage.getItem("fa-dice") || "{}");
    FIELDS.forEach((f) => { if (s[f] !== undefined) $(f).value = s[f]; }); } catch {}
  const save = () => { try { localStorage.setItem("fa-dice",
    JSON.stringify(Object.fromEntries(FIELDS.map((f) => [f, $(f).value])))); } catch {} };
  FIELDS.forEach((f) => $(f).addEventListener("change", save));

  OBR.onReady(() => {
    OBR.broadcast.onMessage(CHANNEL, (event) => { showRoll(event.data.dice); render(event.data); });

    $("roll").addEventListener("click", async () => {
      const dice = [];
      for (let i = 0; i < 3; i++) {
        const n = Math.min(10, Math.max(0, parseInt($("n" + i).value) || 0));
        for (let k = 0; k < n; k++) dice.push([$("c" + i).value, randInt(6)]);
      }
      if (!dice.length) return;
      save();
      const mod = parseInt($("mod").value) || 0;
      const threshold = Math.min(6, Math.max(0, parseInt($("thr").value) || 0));
      const sum = dice.reduce((a, [, v]) => a + v, 0);
      const successes = threshold > 0 ? dice.filter(([, v]) => v >= threshold).length : 0;
      const name = await OBR.player.getName();
      const summary = threshold > 0
        ? `${dice.length}W6: ${successes} Erfolg(e), Summe ${sum + mod}` : `${dice.length}W6: ${sum + mod}`;
      await OBR.broadcast.sendMessage(CHANNEL,
        { name, dice, mod, threshold, successes, total: sum + mod, summary },
        { destination: $("hidden").checked ? "LOCAL" : "ALL" });
    });
  });
</script>
</body>
</html>
