<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fading Age Würfel</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; }
  body { margin: 0; padding: 10px; background: #1e2231; color: #e8e6e3; font-size: 14px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 8px; }
  .tab { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 7px; border: 1px solid #444a63; border-radius: 8px; background: #2a2f45;
    color: #e8e6e3; font-size: 13px; cursor: pointer; }
  .tab svg { width: 20px; height: 20px; }
  .tab.active { background: #b8893c; border-color: #b8893c; color: #1a1408; font-weight: 700; }
  #tray { width: 100%; height: 210px; display: block; border-radius: 10px;
    background: radial-gradient(ellipse at center, #3a2f22 0%, #241d15 100%); }
  #res { min-height: 28px; margin-top: 6px; text-align: center; font-size: 20px; font-weight: 700; color: #8fd694; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .row input[type=color] { width: 40px; height: 32px; padding: 0; border: 1px solid #444a63;
    border-radius: 6px; background: none; cursor: pointer; }
  .star { width: 40px; text-align: center; font-size: 20px; color: #d4a548; }
  .lbl { flex: 1; line-height: 1.15; }
  .lbl small { display: block; opacity: .65; font-size: 11px; }
  input[type=number] { width: 60px; box-sizing: border-box; padding: 6px; border-radius: 6px;
    border: 1px solid #444a63; background: #2a2f45; color: inherit; }
  .seg { display: flex; }
  .seg button { width: 34px; padding: 6px 0; border: 1px solid #444a63; background: #2a2f45;
    color: inherit; cursor: pointer; margin-left: -1px; }
  .seg button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
  .seg button:last-child { border-radius: 0 6px 6px 0; }
  .seg button.on { background: #b8893c; border-color: #b8893c; color: #1a1408; font-weight: 700; }
  .check { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 13px; }
  .go { width: 100%; margin-top: 10px; padding: 10px; border: 0; border-radius: 8px;
    background: #b8893c; color: #1a1408; font-weight: 700; font-size: 15px; cursor: pointer; }
  .go:hover:not(:disabled) { background: #cc9a48; }
  .go.alt { margin-top: 6px; background: #3a6fb8; color: #fff; }
  .go.alt:hover:not(:disabled) { background: #4a80cc; }
  .go:disabled { opacity: .4; cursor: default; }
  #combat { margin-top: 14px; padding: 16px; text-align: center; opacity: .75; }
  #log { margin-top: 10px; max-height: 110px; overflow-y: auto; }
  .entry { padding: 6px 8px; margin-bottom: 6px; background: #2a2f45; border-radius: 6px; font-size: 13px; }
  .chip { display: inline-block; padding: 1px 7px; margin: 3px 4px 0 0; border-radius: 10px;
    font-size: 12px; font-weight: 700; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="tabs">
    <button class="tab active" id="tab-normal" title="Normaler Wurf">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="3"/>
        <circle cx="8" cy="8" r="1.3" fill="currentColor"/><circle cx="16" cy="8" r="1.3" fill="currentColor"/>
        <circle cx="12" cy="12" r="1.3" fill="currentColor"/>
        <circle cx="8" cy="16" r="1.3" fill="currentColor"/><circle cx="16" cy="16" r="1.3" fill="currentColor"/>
      </svg>Normal
    </button>
    <button class="tab" id="tab-combat" title="Kampf">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M4 20 19 5M15 4l5 5M7 17l-3-3"/><path d="M20 20 5 5M9 4L4 9M17 17l3-3"/>
      </svg>Kampf
    </button>
  </div>

  <canvas id="tray"></canvas>
  <div id="res"></div>

  <div id="normal">
    <div class="row"><input type="color" id="cw" value="#d4a548">
      <span class="lbl">W6<small>1 Erfolg auf 5-6</small></span>
      <input type="number" id="nw" min="0" max="10" value="3"></div>
    <div class="row"><input type="color" id="cm" value="#b83a3a">
      <span class="lbl">Merkmal-W6<small>2 Erfolge auf 5-6</small></span>
      <input type="number" id="nm" min="0" max="10" value="0"></div>
    <div class="row"><span class="star">★</span>
      <span class="lbl">Fertigkeit<small>feste Erfolge nach Rang</small></span>
      <div class="seg" id="skill">
        <button data-r="0">-</button><button data-r="1">I</button><button data-r="2">II</button><button data-r="3">III</button>
      </div></div>
    <div class="check"><input id="hidden" type="checkbox"><span>Verdeckt (nur ich sehe das Ergebnis)</span></div>
    <button class="go" id="roll">Würfeln</button>
    <button class="go alt" id="push" disabled>Push</button>
  </div>

  <div id="combat" hidden>Der Kampfmodus folgt als Nächstes.</div>
  <div id="log"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module">
  import OBR from "https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3/+esm";

  const CHANNEL = "de.fadingage.dice";
  const ROMAN = ["", "I", "II", "III"];
  const $ = (id) => document.getElementById(id);
  const safe = (h) => (/^#[0-9a-f]{6}$/i.test(h) ? h : "#888888");
  const lum = (h) => { const n = parseInt(h.slice(1), 16);
    return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255; };
  const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, parseInt(x) || 0));

  function randInt(max) {
    const limit = Math.floor(0x100000000 / max) * max, buf = new Uint32Array(1);
    do { crypto.getRandomValues(buf); } while (buf[0] >= limit);
    return (buf[0] % max) + 1;
  }

  // ---------- Regeln ----------
  const hit = (d) => (d.v >= 5 ? (d.k === "m" ? 2 : 1) : 0);
  const plural = (n) => `${n} Erfolg${n === 1 ? "" : "e"}`;
  function label(st) {
    const w = st.dice.filter((d) => d.k === "w").length, m = st.dice.length - w, p = [];
    if (w) p.push(w + "W6");
    if (m) p.push(m + "MW6");
    if (st.skill) p.push("Fertigkeit " + ROMAN[st.skill]);
    return p.join(" + ");
  }

  // ---------- 3D-Würfel ----------
  const FACES = [3, 4, 1, 6, 2, 5]; // +x, -x, +y, -y, +z, -z
  const NORMALS = { 3: [1,0,0], 4: [-1,0,0], 1: [0,1,0], 6: [0,-1,0], 2: [0,0,1], 5: [0,0,-1] };
  const PIPS = { 1: [[1,1]], 2: [[0,0],[2,2]], 3: [[0,0],[1,1],[2,2]],
    4: [[0,0],[2,0],[0,2],[2,2]], 5: [[0,0],[2,0],[1,1],[0,2],[2,2]],
    6: [[0,0],[2,0],[0,1],[2,1],[0,2],[2,2]] };

  const matCache = {};
  function materials(hex) {
    if (matCache[hex]) return matCache[hex];
    const pip = lum(hex) > 0.55 ? "#1a1408" : "#f5efe0";
    return (matCache[hex] = FACES.map((v) => {
      const c = document.createElement("canvas"); c.width = c.height = 128;
      const g = c.getContext("2d");
      g.fillStyle = hex; g.fillRect(0, 0, 128, 128);
      g.strokeStyle = "rgba(0,0,0,.35)"; g.lineWidth = 8; g.strokeRect(0, 0, 128, 128);
      g.fillStyle = pip;
      PIPS[v].forEach(([x, y]) => { g.beginPath(); g.arc(32 * (x + 1), 32 * (y + 1), 9, 0, 7); g.fill(); });
      return new THREE.MeshStandardMaterial({ map: new THREE.CanvasTexture(c), roughness: 0.5 });
    }));
  }

  const canvas = $("tray");
  const W = canvas.clientWidth || 340, H = 210;
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(window.devicePixelRatio || 1);
  renderer.setSize(W, H, false);
  const scene = new THREE.Scene();
  scene.add(new THREE.AmbientLight(0xffffff, 0.8));
  const sun = new THREE.DirectionalLight(0xffffff, 0.9); sun.position.set(3, 8, 4); scene.add(sun);
  const camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 50);
  camera.position.set(0, 10, 4); camera.lookAt(0, 0, 0);
  const geo = new THREE.BoxGeometry(1, 1, 1);
  let meshes = [];

  // Startet die Wurf-Animation eines Würfels, der am Ende mit Augenzahl v oben liegt
  function launch(m, v, t0) {
    const d = m.userData;
    const qAlign = new THREE.Quaternion().setFromUnitVectors(
      new THREE.Vector3(...NORMALS[v]), new THREE.Vector3(0, 1, 0));
    const qYaw = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.random() * 6.28);
    Object.assign(d, { t0, sx: d.tx + (Math.random() - 0.5) * 3, sz: d.tz - 4,
      qEnd: qYaw.multiply(qAlign),
      axis: new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize(),
      turns: 2 + Math.random() * 2, delay: Math.random() * 150, bounce: 2 + Math.random() * 1.5 });
  }

  function showRoll(dice) {
    meshes.forEach((m) => scene.remove(m)); meshes = [];
    const n = dice.length;
    if (!n) { renderer.render(scene, camera); return; }
    const cols = Math.min(n, 6), rows = Math.ceil(n / cols), t0 = performance.now();
    dice.forEach((d, i) => {
      const m = new THREE.Mesh(geo, materials(d.hex));
      m.userData = { tx: ((i % cols) - (cols - 1) / 2) * 1.5,
                     tz: (Math.floor(i / cols) - (rows - 1) / 2) * 1.5 };
      launch(m, d.v, t0);
      scene.add(m); meshes.push(m);
    });
    requestAnimationFrame(frame);
  }

  function showPush(changes) {
    const t0 = performance.now();
    changes.forEach(([i, v]) => { if (meshes[i]) launch(meshes[i], v, t0); });
    requestAnimationFrame(frame);
  }

  function frame(now) {
    let busy = false;
    meshes.forEach((m) => {
      const d = m.userData, t = Math.min(1, Math.max(0, (now - d.t0 - d.delay) / 1300));
      const e = 1 - Math.pow(1 - t, 3);
      if (t < 1) busy = true;
      m.position.set(d.sx + (d.tx - d.sx) * e,
        0.5 + (1 - e) * 3 + Math.abs(Math.sin(e * Math.PI * 2.5)) * (1 - e) * d.bounce,
        d.sz + (d.tz - d.sz) * e);
      const spin = new THREE.Quaternion().setFromAxisAngle(d.axis, (1 - e) * d.turns * Math.PI * 2);
      m.quaternion.copy(spin.multiply(d.qEnd));
    });
    renderer.render(scene, camera);
    if (busy) requestAnimationFrame(frame);
  }

  // ---------- Zustand und Anzeige ----------
  let myId = "", state = null, skill = 0;

  const chip = (d) => `<span class="chip" style="background:${d.hex};color:${lum(d.hex) > 0.55 ? "#1a1408" : "#f5efe0"}">${d.v}${d.v >= 5 ? " ✓" : ""}</span>`;
  function addEntry(html, who) {
    const div = document.createElement("div");
    div.className = "entry"; div.innerHTML = html;
    div.querySelector(".who").textContent = who;
    $("log").prepend(div);
    while ($("log").children.length > 15) $("log").lastChild.remove();
  }
  function updateUi() {
    $("res").textContent = state ? plural(state.total) + (state.pushed ? " (nach Push)" : "") : "";
    const can = state && state.pid === myId && !state.pushed && state.dice.some((d) => d.v < 5);
    $("push").disabled = !can;
    $("push").textContent = state && state.pushed ? "Gepusht" : "Push (Erfolglose neu würfeln)";
  }

  function cleanRoll(r) {
    return { id: String(r.id).slice(0, 64), pid: String(r.pid || "").slice(0, 64),
      name: String(r.name || "?").slice(0, 40), hidden: !!r.hidden, pushed: false,
      skill: clamp(r.skill, 0, 3), total: Math.max(0, parseInt(r.total) || 0),
      dice: (Array.isArray(r.dice) ? r.dice : []).slice(0, 20).map((d) =>
        ({ k: d.k === "m" ? "m" : "w", v: clamp(d.v, 1, 6) || 1, hex: safe(d.hex) })) };
  }
  function cleanPush(p) {
    return { id: String(p.id).slice(0, 64), name: String(p.name || "?").slice(0, 40),
      delta: parseInt(p.delta) || 0, total: Math.max(0, parseInt(p.total) || 0),
      changes: (Array.isArray(p.changes) ? p.changes : []).slice(0, 20)
        .map(([i, v]) => [parseInt(i), clamp(v, 1, 6) || 1]) };
  }

  function applyRoll(r) {
    state = r; showRoll(r.dice); updateUi();
    addEntry(`<b class="who"></b>: ${label(r)} = <b>${plural(r.total)}</b><div>${r.dice.map(chip).join("")}</div>`, r.name);
  }
  function applyPush(p) {
    if (!state || state.id !== p.id) return;
    const ch = p.changes.filter(([i]) => state.dice[i]);
    ch.forEach(([i, v]) => { state.dice[i].v = v; });
    state.total = p.total; state.pushed = true;
    showPush(ch); updateUi();
    addEntry(`<b class="who"></b> pusht ${ch.map(([i]) => chip(state.dice[i])).join("")} ${p.delta >= 0 ? "+" : ""}${p.delta} = <b>${plural(p.total)}</b>`, p.name);
  }

  // ---------- Bedienung ----------
  const FIELDS = ["cw", "cm", "nw", "nm"];
  function save() { try { localStorage.setItem("fa-dice2", JSON.stringify(
    { ...Object.fromEntries(FIELDS.map((f) => [f, $(f).value])), skill, mode })); } catch {} }
  let mode = "normal";
  function setSkill(r) {
    skill = r;
    document.querySelectorAll("#skill button").forEach((b) => b.classList.toggle("on", +b.dataset.r === r));
  }
  function setMode(m) {
    mode = m;
    $("tab-normal").classList.toggle("active", m === "normal");
    $("tab-combat").classList.toggle("active", m === "combat");
    $("normal").hidden = m !== "normal"; $("combat").hidden = m !== "combat";
  }
  try { const s = JSON.parse(localStorage.getItem("fa-dice2") || "{}");
    FIELDS.forEach((f) => { if (s[f] !== undefined) $(f).value = s[f]; });
    if (s.skill !== undefined) skill = clamp(s.skill, 0, 3);
    if (s.mode === "combat") mode = "combat"; } catch {}
  setSkill(skill); setMode(mode);
  FIELDS.forEach((f) => $(f).addEventListener("change", save));
  document.querySelectorAll("#skill button").forEach((b) =>
    b.addEventListener("click", () => { setSkill(+b.dataset.r); save(); }));
  $("tab-normal").addEventListener("click", () => { setMode("normal"); save(); });
  $("tab-combat").addEventListener("click", () => { setMode("combat"); save(); });

  OBR.onReady(async () => {
    myId = await OBR.player.getId();
    const send = (msg, hidden) =>
      OBR.broadcast.sendMessage(CHANNEL, msg, { destination: hidden ? "LOCAL" : "ALL" });

    OBR.broadcast.onMessage(CHANNEL, (e) => {
      if (e.data.type === "push") applyPush(cleanPush(e.data)); else applyRoll(cleanRoll(e.data));
    });

    $("roll").addEventListener("click", async () => {
      const nw = clamp($("nw").value, 0, 10), nm = clamp($("nm").value, 0, 10), dice = [];
      for (let i = 0; i < nw; i++) dice.push({ k: "w", v: randInt(6), hex: $("cw").value });
      for (let i = 0; i < nm; i++) dice.push({ k: "m", v: randInt(6), hex: $("cm").value });
      if (!dice.length && !skill) return;
      save();
      const total = dice.reduce((a, d) => a + hit(d), 0) + skill;
      const msg = { type: "roll", id: crypto.randomUUID(), pid: myId, name: await OBR.player.getName(),
        dice, skill, total, hidden: $("hidden").checked };
      msg.summary = `${label(msg)}: ${plural(total)}`;
      await send(msg, msg.hidden);
    });

    $("push").addEventListener("click", async () => {
      if (!state || state.pushed) return;
      $("push").disabled = true;
      const changes = []; let delta = 0;
      state.dice.forEach((d, i) => {
        if (d.v >= 5) return;
        const v = randInt(6), w = d.k === "m" ? 2 : 1;
        changes.push([i, v]);
        if (v >= 5) delta += w; else if (v <= 2) delta -= w;
      });
      const total = Math.max(0, state.total + delta);
      await send({ type: "push", id: state.id, name: await OBR.player.getName(), changes, delta, total,
        summary: `Push: ${plural(total)} (${delta >= 0 ? "+" : ""}${delta})` }, state.hidden);
    });
  });
</script>
</body>
</html>
