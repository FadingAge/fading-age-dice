<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fading Age Würfel</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; }
  body { margin: 0; padding: 10px; background: #1e2231; color: #e8e6e3; font-size: 14px; }
  button { font-family: inherit; }
  .tabs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-bottom: 8px; }
  .switch { display: flex; }
  .tab { display: flex; align-items: center; justify-content: center;
    width: 56px; height: 34px; padding: 0; border: 1px solid #444a63; background: #2a2f45;
    color: #e8e6e3; cursor: pointer; }
  .switch .tab:first-child { border-radius: 8px 0 0 8px; }
  .switch .tab:last-child { border-radius: 0 8px 8px 0; margin-left: -1px; }
  .tab.icon { width: 34px; border-radius: 8px; justify-self: end; grid-column: 3; }
  .tab svg { width: 22px; height: 22px; flex: none; }
  .tab.active { background: #b8893c; border-color: #b8893c; color: #1a1408; }
  #tray { width: 100%; height: 190px; display: block; border-radius: 10px;
    background: radial-gradient(ellipse at center, #3a2f22 0%, #241d15 100%); }
  #res { min-height: 28px; margin-top: 6px; text-align: center; font-size: 19px; font-weight: 700; color: #8fd694; }

  .pool-block { margin-top: 6px; }
  .pool-head { display: flex; justify-content: center; gap: 5px; font-weight: 700; margin-bottom: 4px; }
  .pool { display: flex; justify-content: center; gap: 3px; }
  .slot { flex: none; width: 32px; height: 32px; padding: 0; cursor: pointer;
    border: 1.5px solid #444a63; border-radius: 8px; background: transparent;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700; color: #8a90ab; opacity: .55; }
  .slot:hover { border-color: #7b83a3; opacity: .85; }
  .slot.on { background: var(--body); border-color: var(--pip); color: var(--pip);
    color: color-mix(in srgb, var(--pip) 80%, transparent); opacity: 1; }

  .row { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; }
  #skill { flex: none; width: 170px; }
  .star { width: 24px; text-align: center; font-size: 20px; color: #d4a548; flex: none; }
  .seg { flex: 1; display: flex; }
  .seg button { flex: 1; min-width: 0; padding: 7px 0; border: 1px solid #444a63; background: #2a2f45;
    color: inherit; cursor: pointer; margin-left: -1px; }
  .seg button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
  .seg button:last-child { border-radius: 0 6px 6px 0; }
  .seg button.on { background: #b8893c; border-color: #b8893c; color: #1a1408; font-weight: 700; }
  .check { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 10px; font-size: 13px; }
  .go { width: 100%; margin-top: 10px; padding: 10px; border: 0; border-radius: 8px;
    background: #b8893c; color: #1a1408; font-weight: 700; font-size: 15px; cursor: pointer; }
  .go:hover:not(:disabled) { background: #cc9a48; }
  .go.alt { margin-top: 6px; background: #3a6fb8; color: #fff; }
  .go.alt:hover:not(:disabled) { background: #4a80cc; }
  .go.dmg { margin-top: 8px; background: #b83a3a; color: #fff; }
  .go.dmg:hover:not(:disabled) { background: #cc4a4a; }
  .go:disabled { opacity: .4; cursor: default; }

  #cpanel { margin-top: 10px; padding: 8px 10px 10px; border: 1px solid #6b4a4a; border-radius: 10px;
    background: #2b2230; }
  #cpanel .row { margin-top: 0; justify-content: space-between; }
  .lbl { flex: 1; line-height: 1.15; }
  .step { display: flex; align-items: center; }
  .step button { width: 34px; padding: 6px 0; border: 1px solid #444a63; background: #2a2f45;
    color: inherit; font-size: 16px; cursor: pointer; }
  .step button:first-child { border-radius: 6px 0 0 6px; }
  .step button:last-child { border-radius: 0 6px 6px 0; }
  .step span { min-width: 38px; padding: 6px 0; text-align: center; font-weight: 700; font-size: 16px;
    border-top: 1px solid #444a63; border-bottom: 1px solid #444a63; background: #1e2231; }

  #settings .srow { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  #settings .name { width: 46px; flex: none; font-weight: 700; }
  .cl { display: flex; flex-direction: column; gap: 3px; font-size: 11px; opacity: .9; }
  .cl input[type=color] { width: 70px; height: 30px; padding: 0; border: 1px solid #444a63;
    border-radius: 6px; background: none; cursor: pointer; }
  .hint { margin: 12px 0 0; font-size: 12px; opacity: .65; line-height: 1.35; }

  #log { margin-top: 10px; max-height: 90px; overflow-y: auto; }
  .entry { padding: 6px 8px; margin-bottom: 6px; background: #2a2f45; border-radius: 6px; font-size: 13px; }
  .chip { display: inline-block; padding: 1px 7px; margin: 3px 4px 0 0; border-radius: 10px;
    font-size: 12px; font-weight: 700; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="tabs">
    <div class="switch" style="grid-column:2">
    <button class="tab active" id="tab-normal" title="Normaler Wurf" aria-label="Normaler Wurf">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="3"/>
        <circle cx="8" cy="8" r="1.3" fill="currentColor"/><circle cx="16" cy="8" r="1.3" fill="currentColor"/>
        <circle cx="12" cy="12" r="1.3" fill="currentColor"/>
        <circle cx="8" cy="16" r="1.3" fill="currentColor"/><circle cx="16" cy="16" r="1.3" fill="currentColor"/>
      </svg>
    </button>
    <button class="tab" id="tab-combat" title="Kampf" aria-label="Kampf">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M4 20 19 5M15 4l5 5M7 17l-3-3"/><path d="M20 20 5 5M9 4L4 9M17 17l3-3"/>
      </svg>
    </button>
    </div>
    <button class="tab icon" id="tab-set" title="Einstellungen" aria-label="Einstellungen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>
      </svg>
    </button>
  </div>

  <canvas id="tray"></canvas>
  <div id="res"></div>

  <div id="main">
    <div class="pool-block">
      <div class="pool-head"><span>Attribut:</span><span id="pool-w-n"></span><span>W6</span></div>
      <div class="pool" id="pool-w"></div>
    </div>
    <div class="pool-block">
      <div class="pool-head"><span>Merkmal:</span><span id="pool-m-n"></span><span>MW6</span></div>
      <div class="pool" id="pool-m"></div>
    </div>
    <div class="row"><span class="star">★</span>
      <div class="seg" id="skill">
        <button data-r="0">-</button><button data-r="1">I</button><button data-r="2">II</button><button data-r="3">III</button>
      </div></div>
    <div class="check"><input id="hidden" type="checkbox"><label for="hidden">Verdeckt (nur ich)</label></div>
    <button class="go" id="roll">Würfeln</button>
    <button class="go alt" id="push" disabled>Push</button>

    <div id="cpanel" hidden>
      <div class="row"><span class="lbl">Erfolge anpassen</span>
        <div class="step"><button id="adjm">-</button><span id="adjv">0</span><button id="adjp">+</button></div></div>
      <button class="go dmg" id="dmg">Angriffswert würfeln</button>
    </div>
  </div>

  <div id="settings" hidden>
    <div class="srow"><span class="name">W6</span>
      <label class="cl">Würfel<input type="color" id="cw"></label>
      <label class="cl">Augen<input type="color" id="pw"></label></div>
    <div class="srow"><span class="name">MW6</span>
      <label class="cl">Würfel<input type="color" id="cm"></label>
      <label class="cl">Augen<input type="color" id="pm"></label></div>
    <div class="srow"><span class="name">Anzeige</span>
      <div class="seg" id="style"><button data-s="pips">Augen</button><button data-s="num">Zahlen</button></div></div>
    <p class="hint">Deine Würfelfarben sehen alle am Tisch. Augen oder Zahlen gilt nur für deine eigene Ansicht.</p>
    <button class="go" id="sdone">Fertig</button>
  </div>

  <div id="log"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module">
  import OBR from "https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3/+esm";

  const CHANNEL = "de.fadingage.dice";
  const ROMAN = ["", "I", "II", "III"];
  const MAX_POOL = { nw: 7, nm: 3 }, MAX_ATTACK = 10;
  const HEX = /^#[0-9a-f]{6}$/i;
  const $ = (id) => document.getElementById(id);
  const safe = (h, fb = "#888888") => (HEX.test(h) ? h : fb);
  const lum = (h) => { const n = parseInt(h.slice(1), 16);
    return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255; };
  const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, parseInt(x) || 0));

  function randInt(max) {
    const limit = Math.floor(0x100000000 / max) * max, buf = new Uint32Array(1);
    do { crypto.getRandomValues(buf); } while (buf[0] >= limit);
    return (buf[0] % max) + 1;
  }

  // ---------- Einstellungen (nur lokal gespeichert) ----------
  const S = { cw: "#d4a548", pw: "#1a1408", cm: "#b83a3a", pm: "#f5efe0",
    style: "pips", nw: 3, nm: 0, skill: 0, mode: "normal" };
  try {
    const s = JSON.parse(localStorage.getItem("fa-dice3") || localStorage.getItem("fa-dice2") || "{}");
    ["cw", "pw", "cm", "pm"].forEach((k) => { if (HEX.test(s[k])) S[k] = s[k].toLowerCase(); });
    if (s.style === "num") S.style = "num";
    if (s.nw !== undefined) S.nw = clamp(s.nw, 0, MAX_POOL.nw);
    if (s.nm !== undefined) S.nm = clamp(s.nm, 0, MAX_POOL.nm);
    if (s.skill !== undefined) S.skill = clamp(s.skill, 0, 3);
    if (s.mode === "combat") S.mode = "combat";
  } catch {}
  const save = () => { try { localStorage.setItem("fa-dice3", JSON.stringify(S)); } catch {} };

  // ---------- Regeln ----------
  const hit = (d) => (d.v >= 5 ? (d.k === "m" ? 2 : 1) : 0);
  const plural = (n) => `${n} Erfolg${n === 1 ? "" : "e"}`;
  function label(st) {
    const w = st.dice.filter((d) => d.k === "w").length, m = st.dice.length - w, p = [];
    if (w) p.push(w + "W6");
    if (m) p.push(m + "MW6");
    if (st.skill) p.push("Fertigkeit " + ROMAN[st.skill]);
    return p.join(" + ");
  }

  // ---------- 3D-Würfel ----------
  const FACES = [3, 4, 1, 6, 2, 5]; // Materialreihenfolge der BoxGeometry: +x, -x, +y, -y, +z, -z
  const NORMALS = { 3: [1,0,0], 4: [-1,0,0], 1: [0,1,0], 6: [0,-1,0], 2: [0,0,1], 5: [0,0,-1] };
  const PIPS = { 1: [[1,1]], 2: [[0,0],[2,2]], 3: [[0,0],[1,1],[2,2]],
    4: [[0,0],[2,0],[0,2],[2,2]], 5: [[0,0],[2,0],[1,1],[0,2],[2,2]],
    6: [[0,0],[2,0],[0,1],[2,1],[0,2],[2,2]] };

  // Würfel mit abgerundeten Kanten: unterteilter Würfel, dessen Randpunkte auf eine Rundung gezogen werden
  function roundedCube(n, r) {
    const g = new THREE.BoxGeometry(1, 1, 1, n, n, n);
    const pos = g.attributes.position, nor = g.attributes.normal, lim = 0.5 - r;
    const p = new THREE.Vector3(), c = new THREE.Vector3(), d = new THREE.Vector3();
    const cl = (x) => Math.max(-lim, Math.min(lim, x));
    for (let i = 0; i < pos.count; i++) {
      p.fromBufferAttribute(pos, i);
      c.set(cl(p.x), cl(p.y), cl(p.z));
      d.subVectors(p, c);
      if (d.lengthSq() > 1e-12) {
        d.normalize();
        p.copy(c).addScaledVector(d, r);
        nor.setXYZ(i, d.x, d.y, d.z);
      }
      pos.setXYZ(i, p.x, p.y, p.z);
    }
    pos.needsUpdate = true; nor.needsUpdate = true;
    return g;
  }

  const matCache = {};
  function materials(hex, pip, style) {
    const key = hex + pip + style;
    if (matCache[key]) return matCache[key];
    if (Object.keys(matCache).length >= 30) {
      for (const k in matCache) { matCache[k].forEach((m) => { m.map.dispose(); m.dispose(); }); delete matCache[k]; }
    }
    return (matCache[key] = FACES.map((v) => {
      const c = document.createElement("canvas"); c.width = c.height = 128;
      const g = c.getContext("2d");
      g.fillStyle = hex; g.fillRect(0, 0, 128, 128);
      g.fillStyle = pip;
      if (style === "num") {
        g.font = "bold 80px system-ui, sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
        g.fillText(String(v), 64, 70);
      } else {
        PIPS[v].forEach(([x, y]) => { g.beginPath(); g.arc(32 * (x + 1), 32 * (y + 1), 10, 0, 7); g.fill(); });
      }
      return new THREE.MeshStandardMaterial({ map: new THREE.CanvasTexture(c), roughness: 0.35, metalness: 0.05 });
    }));
  }

  const canvas = $("tray");
  const W = canvas.clientWidth || 260, H = 190;
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(window.devicePixelRatio || 1);
  renderer.setSize(W, H, false);
  const scene = new THREE.Scene();
  scene.add(new THREE.AmbientLight(0xffffff, 0.8));
  const sun = new THREE.DirectionalLight(0xffffff, 0.9); sun.position.set(3, 8, 4); scene.add(sun);
  const camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 50);
  camera.position.set(0, 10, 4); camera.lookAt(0, 0, 0);
  const geo = roundedCube(20, 0.15);
  let meshes = [], shown = [];

  // Startet die Wurf-Animation eines Würfels, der am Ende mit Augenzahl v oben liegt
  function launch(m, v, t0) {
    const d = m.userData;
    const qAlign = new THREE.Quaternion().setFromUnitVectors(
      new THREE.Vector3(...NORMALS[v]), new THREE.Vector3(0, 1, 0));
    const qYaw = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.random() * 6.28);
    Object.assign(d, { t0, sx: d.tx + (Math.random() - 0.5) * 3, sz: d.tz - 4,
      qEnd: qYaw.multiply(qAlign),
      axis: new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize(),
      turns: 2 + Math.random() * 2, delay: Math.random() * 150, bounce: 2 + Math.random() * 1.5 });
  }

  function build(dice, animate, remember = true) {
    meshes.forEach((m) => scene.remove(m)); meshes = [];
    if (remember) shown = dice;
    const n = dice.length;
    if (!n) { renderer.render(scene, camera); return; }
    const cols = Math.min(n, 5), rows = Math.ceil(n / cols), t0 = animate ? performance.now() : -1e9;
    dice.forEach((d, i) => {
      const m = new THREE.Mesh(geo, materials(d.hex, d.pip, S.style));
      m.userData = { tx: ((i % cols) - (cols - 1) / 2) * 1.5, tz: (Math.floor(i / cols) - (rows - 1) / 2) * 1.5,
        hex: d.hex, pip: d.pip };
      launch(m, d.v, t0);
      scene.add(m); meshes.push(m);
    });
    if (animate) requestAnimationFrame(frame); else frame(performance.now());
  }
  const showRoll = (dice) => build(dice, true);
  const showStatic = (dice) => build(dice, false);
  const showPreview = () => build([{ v: 5, hex: S.cw, pip: S.pw }, { v: 3, hex: S.cm, pip: S.pm }], false, false);

  function showPush(changes) {
    const t0 = performance.now();
    changes.forEach(([i, v]) => { if (meshes[i]) launch(meshes[i], v, t0); });
    requestAnimationFrame(frame);
  }

  function restyle() {
    meshes.forEach((m) => { m.material = materials(m.userData.hex, m.userData.pip, S.style); });
    renderer.render(scene, camera);
  }

  function frame(now) {
    let busy = false;
    meshes.forEach((m) => {
      const d = m.userData, t = Math.min(1, Math.max(0, (now - d.t0 - d.delay) / 1300));
      const e = 1 - Math.pow(1 - t, 3);
      if (t < 1) busy = true;
      m.position.set(d.sx + (d.tx - d.sx) * e,
        0.5 + (1 - e) * 3 + Math.abs(Math.sin(e * Math.PI * 2.5)) * (1 - e) * d.bounce,
        d.sz + (d.tz - d.sz) * e);
      const spin = new THREE.Quaternion().setFromAxisAngle(d.axis, (1 - e) * d.turns * Math.PI * 2);
      m.quaternion.copy(spin.multiply(d.qEnd));
    });
    renderer.render(scene, camera);
    if (busy) requestAnimationFrame(frame);
  }

  // ---------- Zustand und Anzeige ----------
  let myId = "", state = null, adj = 0;

  const chip = (d, mark = true) => `<span class="chip" style="background:${d.hex};color:${lum(d.hex) > 0.55 ? "#1a1408" : "#f5efe0"}">${d.v}${mark && d.v >= 5 ? " ✓" : ""}</span>`;
  function addEntry(html, who) {
    const div = document.createElement("div");
    div.className = "entry"; div.innerHTML = html;
    div.querySelector(".who").textContent = who;
    $("log").prepend(div);
    while ($("log").children.length > 15) $("log").lastChild.remove();
  }
  function updateUi() {
    const combat = !!state && state.mode === "combat", mine = !!state && state.pid === myId;
    let txt = "";
    if (state) {
      if (state.done) txt = state.n > 0 ? `Angriffswert: ${state.sum}` : "Angriff verfehlt";
      else txt = plural(state.total) + (state.pushed ? " (nach Push)" : "")
        + (combat && state.total === 0 ? ", Angriff verfehlt" : "");
    }
    $("res").textContent = txt;
    const can = mine && !state.pushed && !state.done && state.dice.some((d) => d.v < 5);
    $("push").disabled = !can;
    $("push").textContent = state && state.pushed ? "Gepusht" : "Push";
    const showCombat = combat && mine && !state.done && state.total > 0;
    $("cpanel").hidden = !showCombat;
    if (showCombat) {
      $("adjv").textContent = adj;
      $("adjm").disabled = adj <= 0; $("adjp").disabled = adj >= MAX_ATTACK;
      $("dmg").disabled = false;
      $("dmg").textContent = adj > 0 ? `Angriffswert würfeln (${adj}W6)` : "Angriff verfehlt";
    }
  }

  const cleanDie = (d) => ({ v: clamp(d.v, 1, 6) || 1, hex: safe(d.hex), pip: safe(d.pip, "#f5efe0") });
  function cleanRoll(r) {
    return { id: String(r.id).slice(0, 64), pid: String(r.pid || "").slice(0, 64),
      name: String(r.name || "?").slice(0, 40), hidden: !!r.hidden, pushed: false, done: false,
      mode: r.mode === "combat" ? "combat" : "normal",
      skill: clamp(r.skill, 0, 3), total: Math.max(0, parseInt(r.total) || 0),
      dice: (Array.isArray(r.dice) ? r.dice : []).slice(0, 20).map((d) => ({ k: d.k === "m" ? "m" : "w", ...cleanDie(d) })) };
  }
  function cleanPush(p) {
    return { id: String(p.id).slice(0, 64), name: String(p.name || "?").slice(0, 40),
      delta: parseInt(p.delta) || 0, total: Math.max(0, parseInt(p.total) || 0),
      changes: (Array.isArray(p.changes) ? p.changes : []).slice(0, 20)
        .map(([i, v]) => [parseInt(i), clamp(v, 1, 6) || 1]) };
  }
  function cleanDamage(p) {
    return { id: String(p.id).slice(0, 64), name: String(p.name || "?").slice(0, 40),
      base: Math.max(0, parseInt(p.base) || 0),
      dice: (Array.isArray(p.dice) ? p.dice : []).slice(0, MAX_ATTACK).map(cleanDie) };
  }

  function applyRoll(r) {
    state = r; adj = Math.min(MAX_ATTACK, r.total);
    showRoll(r.dice); updateUi();
    const miss = r.mode === "combat" && r.total === 0 ? " (Angriff verfehlt)" : "";
    addEntry(`<b class="who"></b>: ${r.mode === "combat" ? "Angriff " : ""}${label(r)} = <b>${plural(r.total)}</b>${miss}<div>${r.dice.map((d) => chip(d)).join("")}</div>`, r.name);
  }
  function applyDamage(p) {
    const n = p.dice.length, sum = p.dice.reduce((a, d) => a + d.v, 0);
    if (state && state.id === p.id) { state.done = true; state.n = n; state.sum = sum; }
    showRoll(p.dice); updateUi();
    const adjusted = p.base !== n ? ` (angepasst auf ${n})` : "";
    addEntry(n > 0
      ? `<b class="who"></b>: Angriffswert aus ${plural(p.base)}${adjusted}: ${n}W6 = <b>${sum}</b><div>${p.dice.map((d) => chip(d, false)).join("")}</div>`
      : `<b class="who"></b>: Angriff verfehlt, ${plural(p.base)} angepasst auf 0`, p.name);
  }
  function applyPush(p) {
    if (!state || state.id !== p.id || state.done) return;
    const ch = p.changes.filter(([i]) => state.dice[i]);
    ch.forEach(([i, v]) => { state.dice[i].v = v; });
    state.total = p.total; state.pushed = true; adj = Math.min(MAX_ATTACK, state.total);
    showPush(ch); updateUi();
    addEntry(`<b class="who"></b> pusht ${ch.map(([i]) => chip(state.dice[i])).join("")} ${p.delta >= 0 ? "+" : ""}${p.delta} = <b>${plural(p.total)}</b>`, p.name);
  }

  // ---------- Bedienung ----------
  // Würfelauswahl: antippen setzt die Anzahl, erneutes Antippen des letzten gefüllten Feldes nimmt einen weg
  const POOLS = [["pool-w", "nw", "cw", "pw"], ["pool-m", "nm", "cm", "pm"]];
  POOLS.forEach(([id, key]) => {
    const el = $(id);
    for (let i = 1; i <= MAX_POOL[key]; i++) {
      const b = document.createElement("button");
      b.className = "slot"; b.dataset.n = i; b.textContent = i; b.setAttribute("aria-label", String(i));
      el.appendChild(b);
    }
    el.addEventListener("click", (e) => {
      const b = e.target.closest(".slot"); if (!b) return;
      const n = +b.dataset.n;
      S[key] = S[key] === n ? n - 1 : n;
      save(); paint();
    });
  });
  function paint() {
    POOLS.forEach(([id, key, c, p]) => {
      const el = $(id);
      el.style.setProperty("--body", S[c]); el.style.setProperty("--pip", S[p]);
      [...el.children].forEach((b, i) => b.classList.toggle("on", i < S[key]));
      $(id + "-n").textContent = S[key];
    });
    document.querySelectorAll("#skill button").forEach((b) => b.classList.toggle("on", +b.dataset.r === S.skill));
    document.querySelectorAll("#style button").forEach((b) => b.classList.toggle("on", b.dataset.s === S.style));
    $("tab-normal").classList.toggle("active", S.mode === "normal" && !settingsOpen);
    $("tab-combat").classList.toggle("active", S.mode === "combat" && !settingsOpen);
    $("tab-set").classList.toggle("active", settingsOpen);
    $("roll").textContent = S.mode === "combat" ? "Angriff würfeln" : "Würfeln";
  }

  let settingsOpen = false;
  function setSettings(open) {
    settingsOpen = open;
    $("main").hidden = open; $("settings").hidden = !open;
    paint();
    if (open) showPreview(); else showStatic(shown);
  }

  ["cw", "pw", "cm", "pm"].forEach((k) => {
    $(k).value = S[k];
    $(k).addEventListener("input", () => { S[k] = $(k).value; paint(); showPreview(); });
    $(k).addEventListener("change", save);
  });
  document.querySelectorAll("#style button").forEach((b) => b.addEventListener("click", () => {
    S.style = b.dataset.s === "num" ? "num" : "pips"; save(); paint(); restyle();
  }));
  document.querySelectorAll("#skill button").forEach((b) =>
    b.addEventListener("click", () => { S.skill = +b.dataset.r; save(); paint(); }));
  const pickMode = (m) => () => { S.mode = m; save(); if (settingsOpen) setSettings(false); else paint(); };
  $("tab-normal").addEventListener("click", pickMode("normal"));
  $("tab-combat").addEventListener("click", pickMode("combat"));
  $("tab-set").addEventListener("click", () => setSettings(!settingsOpen));
  $("sdone").addEventListener("click", () => setSettings(false));
  paint();

  OBR.onReady(async () => {
    myId = await OBR.player.getId();
    const send = (msg, hidden) =>
      OBR.broadcast.sendMessage(CHANNEL, msg, { destination: hidden ? "LOCAL" : "ALL" });

    OBR.broadcast.onMessage(CHANNEL, (e) => {
      const t = e.data.type;
      if (t === "push") applyPush(cleanPush(e.data));
      else if (t === "damage") applyDamage(cleanDamage(e.data));
      else applyRoll(cleanRoll(e.data));
    });

    $("adjm").addEventListener("click", () => { adj = Math.max(0, adj - 1); updateUi(); });
    $("adjp").addEventListener("click", () => { adj = Math.min(MAX_ATTACK, adj + 1); updateUi(); });

    $("dmg").addEventListener("click", async () => {
      if (!state || state.done || state.pid !== myId || state.mode !== "combat" || state.total <= 0) return;
      $("dmg").disabled = true;
      const n = clamp(adj, 0, MAX_ATTACK);
      const dice = Array.from({ length: n }, () => ({ v: randInt(6), hex: S.cw, pip: S.pw }));
      const sum = dice.reduce((a, d) => a + d.v, 0);
      await send({ type: "damage", id: state.id, name: await OBR.player.getName(), base: state.total, dice,
        summary: n > 0 ? `Angriffswert ${sum} (${n}W6)` : "Angriff verfehlt" }, state.hidden);
    });

    $("roll").addEventListener("click", async () => {
      const dice = [];
      for (let i = 0; i < S.nw; i++) dice.push({ k: "w", v: randInt(6), hex: S.cw, pip: S.pw });
      for (let i = 0; i < S.nm; i++) dice.push({ k: "m", v: randInt(6), hex: S.cm, pip: S.pm });
      if (!dice.length && !S.skill) return;
      const total = dice.reduce((a, d) => a + hit(d), 0) + S.skill, mode = S.mode;
      const msg = { type: "roll", id: crypto.randomUUID(), pid: myId, name: await OBR.player.getName(),
        dice, skill: S.skill, total, hidden: $("hidden").checked, mode };
      msg.summary = `${mode === "combat" ? "Angriff " : ""}${label(msg)}: ${plural(total)}`
        + (mode === "combat" && total === 0 ? ", verfehlt" : "");
      await send(msg, msg.hidden);
    });

    $("push").addEventListener("click", async () => {
      if (!state || state.pushed) return;
      $("push").disabled = true;
      const changes = []; let delta = 0;
      state.dice.forEach((d, i) => {
        if (d.v >= 5) return;
        const v = randInt(6), w = d.k === "m" ? 2 : 1;
        changes.push([i, v]);
        if (v >= 5) delta += w; else if (v <= 2) delta -= w;
      });
      const total = Math.max(0, state.total + delta);
      await send({ type: "push", id: state.id, name: await OBR.player.getName(), changes, delta, total,
        summary: `Push: ${plural(total)} (${delta >= 0 ? "+" : ""}${delta})` }, state.hidden);
    });
  });
</script>
</body>
</html>
