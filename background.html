<!doctype html>
<html>
  <body>
    <script type="module">
      import OBR from "https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3/+esm";

      const CHANNEL = "de.fadingage.dice";
      const MINI_ID = "de.fadingage.dice.mini";
      const BASE = "https://fadingage.github.io/fading-age-dice/";

      OBR.onReady(async () => {
        const myId = await OBR.player.getId();
        let lastMini = 0;
        // Einstellung "Mini-Fenster" aus dem Panel (gleiche Herkunft, daher gleicher Speicher)
        const setting = () => {
          try { const m = JSON.parse(localStorage.getItem("fa-dice3") || "{}").mini; return ["all", "gm", "off"].includes(m) ? m : "all"; } catch { return "all"; }
        };
        const note = (r) => setTimeout(() => OBR.notification.show(`${r.name}: ${r.summary}`, "DEFAULT"), 2000);

        OBR.broadcast.onMessage(CHANNEL, async (event) => {
          const r = event.data;
          try {
            const mode = setting();
            let mini = mode !== "off";
            if (mini && mode === "gm") mini = (await OBR.player.getRole()) === "GM";
            if (mini && (await OBR.action.getIsOpen())) mini = false; // ist das Panel offen, zeigt es die Würfe selbst
            if (mini && r.type !== "push" && r.type !== "damage") {
              if (r.pid === myId || r.hidden) return;
              // Neuer Wurf: Mini-Fenster unten rechts neu öffnen, der Wurf steckt in der Adresse
              lastMini = Date.now();
              const w = await OBR.viewport.getWidth(), h = await OBR.viewport.getHeight();
              await OBR.popover.close(MINI_ID).catch(() => {});
              await OBR.popover.open({
                id: MINI_ID, url: `${BASE}index.html?mini=1&m=${encodeURIComponent(JSON.stringify(r))}`,
                width: 280, height: 262, anchorReference: "POSITION", anchorPosition: { left: w - 16, top: h - 84 },
                anchorOrigin: { horizontal: "LEFT", vertical: "TOP" }, transformOrigin: { horizontal: "RIGHT", vertical: "BOTTOM" },
                hidePaper: true, disableClickAway: true, marginThreshold: 0,
              });
              return;
            }
            if (mini && Date.now() - lastMini < 14000) { lastMini = Date.now(); return; } // Push und Angriffswert zeigt das offene Mini-Fenster
          } catch (e) { /* bei Fehlern bleibt die Benachrichtigung */ }
          note(r);
        });
      });
    </script>
  </body>
</html>
