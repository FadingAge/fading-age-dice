<!doctype html>
<html>
  <body>
    <script type="module">
      import OBR from "https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3/+esm";

      const CHANNEL = "de.fadingage.dice";
      const BASE = "https://fadingage.github.io/fading-age-dice/";
      const MAX_SLOTS = 3, HEIGHT = 208, WIDTH = 224, GAP = 6, STAY = 11500;

      OBR.onReady(async () => {
        const myId = await OBR.player.getId();
        const slots = []; // je Fenster: { rid, pid, until }
        const rolls = new Map(); // fremde Würfe, damit Push und Angriffswert das Fenster später wieder öffnen können
        const mine = new Set(); // Ids eigener Würfe, dafür gibt es weder Mini-Fenster noch Benachrichtigung
        // Einstellung "Mini-Fenster" aus dem Panel (gleiche Herkunft, daher gleicher Speicher)
        const setting = () => {
          try { const m = JSON.parse(localStorage.getItem("fa-dice3") || "{}").mini; return ["all", "gm", "off"].includes(m) ? m : "all"; } catch { return "all"; }
        };
        const lite = () => { try { return JSON.parse(localStorage.getItem("fa-dice3") || "{}").lite === true; } catch { return false; } }; // Sparmodus: höchstens 2 Mini-Fenster
        const note = (r) => setTimeout(() => OBR.notification.show(`${r.name}: ${r.summary}`, "DEFAULT"), 2000);
        const sid = (i) => `de.fadingage.dice.mini.${i}`;

        const openMini = async (roll, later) => {
          const now = Date.now();
          // Fenster wählen: dasselbe Spieler-Fenster, sonst ein freies, sonst das älteste
          const w = await OBR.viewport.getWidth(), h = await OBR.viewport.getHeight();
          const n = Math.max(1, Math.min(lite() ? 2 : MAX_SLOTS, Math.floor((h - 100) / (HEIGHT + GAP))));
          let i = -1;
          for (let k = 0; k < n; k++) if (slots[k] && slots[k].pid === roll.pid) { i = k; break; }
          if (i < 0) for (let k = 0; k < n; k++) if (!slots[k] || slots[k].until < now) { i = k; break; }
          if (i < 0) { i = 0; for (let k = 1; k < n; k++) if (slots[k].until < slots[i].until) i = k; }
          slots[i] = { rid: roll.id, pid: roll.pid, until: now + STAY };
          await OBR.popover.close(sid(i)).catch(() => {});
          await OBR.popover.open({
            id: sid(i), url: `${BASE}index.html?mini=1&s=${i}&m=${encodeURIComponent(JSON.stringify(roll))}${later ? `&d=${encodeURIComponent(JSON.stringify(later))}` : ""}`,
            width: WIDTH, height: HEIGHT, anchorReference: "POSITION", anchorPosition: { left: w - 16, top: h - 84 - i * (HEIGHT + GAP) },
            anchorOrigin: { horizontal: "LEFT", vertical: "TOP" }, transformOrigin: { horizontal: "RIGHT", vertical: "BOTTOM" },
            hidePaper: true, disableClickAway: true, marginThreshold: 0,
          });
        };

        const handle = async (r) => {
          const isRoll = r.type !== "push" && r.type !== "damage";
          if (isRoll && r.pid === myId) { mine.add(r.id); if (mine.size > 60) mine.delete(mine.values().next().value); return; }
          if (!isRoll && mine.has(r.id)) return;
          const now = Date.now();

          if (isRoll) {
            if (r.hidden) return;
            rolls.set(r.id, r); if (rolls.size > 30) rolls.delete(rolls.keys().next().value);
          } else {
            // Push und Angriffswert gehören zu einem schon offenen Mini-Fenster: nur dessen Anzeigedauer verlängern
            const s = slots.find((x) => x && x.rid === r.id && x.until > now);
            if (s) { s.until = now + STAY; return; }
          }

          let mini = setting() !== "off";
          if (mini && setting() === "gm") mini = (await OBR.player.getRole()) === "GM";
          if (!mini) { note(r); return; }
          if (isRoll) return openMini(r, null);
          // Das Fenster war schon zu: mit dem zugehörigen Wurf wieder öffnen
          const roll = rolls.get(r.id);
          if (roll) return openMini(roll, r); // beim Push startet das Fenster mit dem ursprünglichen Wurf und wendet den Push dann an
          note(r);
        };

        // ---------- Initiative: die SL-Extension ruft aus, hier erscheint die Ansage und der nächste Wurf wird zur Initiative ----------
        const INIT = "de.fadingage.init", INIT_KEY = "fa-init", AID = "de.fadingage.dice.announce";
        const cleanName = (x) => String(x == null ? "?" : x).replace(/[\u0000-\u001f<>]/g, "").slice(0, 24);
        const cleanList = (a) => (Array.isArray(a) ? a : []).slice(0, 12).map((e) => ({ n: cleanName(e && e.n), v: Math.min(6, Math.max(1, parseInt(e && e.v) || 1)) }));
        const announce = async (m, height) => {
          const w = await OBR.viewport.getWidth(), h = await OBR.viewport.getHeight();
          await OBR.popover.close(AID).catch(() => {});
          await OBR.popover.open({
            id: AID, url: `${BASE}announce.html?m=${encodeURIComponent(JSON.stringify(m))}`,
            width: 300, height: Math.min(height, Math.max(120, h - 100)), anchorReference: "POSITION", anchorPosition: { left: w / 2, top: 70 },
            anchorOrigin: { horizontal: "LEFT", vertical: "TOP" }, transformOrigin: { horizontal: "CENTER", vertical: "TOP" },
            hidePaper: true, disableClickAway: true, marginThreshold: 0,
          });
        };
        const armedId = () => { try { const o = JSON.parse(localStorage.getItem(INIT_KEY) || "null"); return o && o.id; } catch { return null; } };
        OBR.broadcast.onMessage(INIT, async (event) => {
          try {
            const m = event.data; if (!m || typeof m !== "object") return;
            const id = String(m.id || "").slice(0, 64), gm = (await OBR.player.getRole()) === "GM";
            if (m.type === "start") {
              if (gm) return; // die SL würfelt für die Gegner in ihrer Extension
              try { localStorage.setItem(INIT_KEY, JSON.stringify({ id, t: Date.now() })); } catch { /* ignorieren */ }
              OBR.broadcast.sendMessage(INIT, { type: "ack", id, pid: myId, name: cleanName(await OBR.player.getName()) }, { destination: "ALL" }).catch(() => {});
              await announce({ k: "start" }, 132);
            } else if (m.type === "cancel") {
              if (armedId() === id) { try { localStorage.removeItem(INIT_KEY); } catch { /* ignorieren */ } }
              await OBR.popover.close(AID).catch(() => {});
            } else if (m.type === "result") {
              if (armedId() === id) { try { localStorage.removeItem(INIT_KEY); } catch { /* ignorieren */ } }
              const r = { k: "result", enemy: Math.min(6, Math.max(1, parseInt(m.enemy) || 1)), fast: cleanList(m.fast), same: cleanList(m.same), slow: cleanList(m.slow) };
              const groups = [r.fast, r.same, r.slow].filter((g) => g.length).length + 1;
              await announce(r, 78 + groups * 34 + (r.fast.length + r.same.length + r.slow.length) * 8);
            }
          } catch { /* ignorieren */ }
        });

        // ---------- Charakter automatisch mit der SL teilen (nur der gerade gewählte Charakter, nur Lesezugriff) ----------
        const CHARS = "de.fadingage.chars";
        let lastChar = "";
        const num = (x, lo, hi) => Math.min(hi, Math.max(lo, parseInt(x) || 0));
        const mySnap = async () => {
          let c = null;
          try {
            const s = JSON.parse(localStorage.getItem("fa-dice3") || "{}");
            const ch = Array.isArray(s.chars) && s.chars.length ? s.chars[Math.min(Math.max(0, parseInt(s.ci) || 0), s.chars.length - 1)] : null;
            if (ch && typeof ch === "object") c = {
              n: cleanName(ch.n), t: ch.t === "v" || ch.t === "a" ? ch.t : "w",
              a: (Array.isArray(ch.a) ? ch.a : []).slice(0, 7).map((v) => num(v, 1, 7)), k: (Array.isArray(ch.k) ? ch.k : []).slice(0, 4).map((v) => num(v, 0, 3)),
              f: (Array.isArray(ch.f) ? ch.f : []).slice(0, 24).map((e) => ({ n: cleanName(e && e.n), r: num(e && e.r, 1, 3) })),
              m: (Array.isArray(ch.m) ? ch.m : []).slice(0, 12).map((e) => ({ n: cleanName(e && e.n), v: num(e && e.v, 1, 3) })),
              x: (Array.isArray(ch.x) ? ch.x : []).slice(0, 12).map((e) => cleanName(e)) };
          } catch { c = null; }
          return { type: "char", pid: myId, name: cleanName(await OBR.player.getName()), c };
        };
        const shareChar = async (force) => {
          try {
            if ((await OBR.player.getRole()) === "GM") return; // die SL legt ihre Charaktere in der SL-Extension an
            const m = await mySnap(), key = JSON.stringify(m);
            if (!force && key === lastChar) return;
            lastChar = key; await OBR.broadcast.sendMessage(CHARS, m, { destination: "ALL" });
          } catch { /* ignorieren */ }
        };
        let shareTm = 0;
        window.addEventListener("storage", (e) => { if (e.key === "fa-share-req") { shareChar(true); return; } if (e.key === "fa-dice3" || e.key === null) { clearTimeout(shareTm); shareTm = setTimeout(() => shareChar(false), 700); } });
        OBR.broadcast.onMessage(CHARS, (event) => {
          const m = event.data; if (!m || typeof m !== "object") return;
          if (m.type === "charreq") shareChar(true);
          else if (m.type === "charack" && m.pid === myId) { try { localStorage.setItem("fa-share-ack", String(Date.now())); } catch { /* ignorieren */ } }
        });
        setTimeout(() => shareChar(true), 1500);

        // Nachrichten nacheinander abarbeiten, damit gleichzeitige Würfe sich nicht um dasselbe Fenster streiten
        let chain = Promise.resolve();
        OBR.broadcast.onMessage(CHANNEL, (event) => {
          const r = event.data;
          chain = chain.then(() => handle(r)).catch(() => { try { note(r); } catch { /* ignorieren */ } });
        });
      });
    </script>
  </body>
</html>
