<!doctype html>
<html>
  <body>
    <script type="module">
      import OBR from "https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3/+esm";

      // Sammelt im Hintergrund die Initiative-Würfe der Spieler, auch wenn das SL-Panel zu ist.
      // Das Panel liest den Stand aus dem Speicher (gleiche Herkunft) und zeigt ihn an.
      const INIT = "de.fadingage.init", GOT = "fa-sl-got";
      const txt = (x) => String(x == null ? "?" : x).replace(/[\u0000-\u001f<>]/g, "").slice(0, 24);
      const read = () => { try { const o = JSON.parse(localStorage.getItem(GOT) || "null"); return o && typeof o === "object" && o.p ? o : { id: "", p: {} }; } catch { return { id: "", p: {} }; } };
      const write = (o) => { try { localStorage.setItem(GOT, JSON.stringify(o)); } catch { /* ignorieren */ } };

      OBR.onReady(async () => {
        const gm = (await OBR.player.getRole()) === "GM";
        OBR.broadcast.onMessage(INIT, (event) => {
          const m = event.data; if (!gm || !m || typeof m !== "object") return;
          const id = String(m.id || "").slice(0, 64), pid = String(m.pid || "").slice(0, 64);
          if (m.type === "start") { write({ id, p: {} }); return; }
          if (m.type === "cancel") { if (read().id === id) write({ id: "", p: {} }); return; }
          const g = read(); if (g.id !== id || !pid) return;
          if (m.type === "ack") g.p[pid] = { ...g.p[pid], n: txt(m.name), ready: true };
          else if (m.type === "roll") g.p[pid] = { n: txt(m.name), ready: true, v: Math.min(6, Math.max(1, parseInt(m.v) || 1)) };
          else return;
          write(g);
        });
      });
    </script>
  </body>
</html>
