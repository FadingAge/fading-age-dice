<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fading Age Charakter</title>
<link rel="stylesheet" href="../looks.css">
<script src="../looks.js"></script>
<style>
  :root { font-family: system-ui, sans-serif; }
  body { margin: 0; padding: 10px 12px 16px; background: var(--bg); color: var(--txt); font-size: 14px; }
  [hidden] { display: none !important; }
  button, select, input, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; }
  .top { display: flex; gap: 6px; align-items: stretch; margin-bottom: 10px; }
  .top select { flex: 1; min-width: 0; height: 36px; padding: 0 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); font-weight: 700; }
  .ibtn { flex: none; min-width: 38px; height: 36px; padding: 0 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--mut); display: flex; align-items: center; justify-content: center; font-weight: 700; }
  .ibtn:hover:not(:disabled) { border-color: var(--line2); color: var(--txt); }
  .ibtn:disabled { opacity: .4; cursor: default; }
  .ibtn.on { background: var(--acc); border-color: var(--acc); color: var(--onacc); }
  .ibtn svg { width: 18px; height: 18px; }
  .tabs { display: flex; margin: 0 0 10px; }
  .tabs button { flex: 1; padding: 8px 2px; border: 1px solid var(--line); background: var(--panel); color: var(--mut); font-size: 12px; font-weight: 700; margin-left: -1px; position: relative; }
  .tabs button:first-child { border-radius: 8px 0 0 8px; margin-left: 0; }
  .tabs button:last-child { border-radius: 0 8px 8px 0; }
  .tabs button.on { background: var(--acc); border-color: var(--acc); color: var(--onacc); }
  .tabs .dot { position: absolute; top: 3px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: #d9524a; }
  h2 { margin: 14px 0 6px; font-size: 12px; font-weight: 700; letter-spacing: .5px; color: var(--mut); text-transform: uppercase; }
  .card { padding: 8px 10px; margin-bottom: 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
  .who { font-size: 20px; font-weight: 800; color: var(--acc); line-height: 1.2; }
  .sub { margin-top: 2px; font-size: 12px; color: var(--mut); }
  .bar { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; padding: 8px 10px; border-radius: 8px; border: 1px solid #b83a3a; background: rgba(184,58,58,.18); font-size: 13px; line-height: 1.35; }
  .bar span { flex: 1; }
  .bar.info { border-color: var(--line2); background: rgba(160,112,215,.14); }
  .btn { padding: 6px 10px; border: 1px solid var(--line2); border-radius: 8px; background: var(--bg); font-size: 12px; font-weight: 700; }
  .btn:hover { border-color: var(--acc); }
  .btn.go { background: var(--acc); border-color: var(--acc); color: var(--onacc); }
  .btn.warn { border-color: #b83a3a; }
  .big { width: 100%; padding: 10px; border: 0; border-radius: 8px; background: var(--acc); color: var(--onacc); font-weight: 700; font-size: 15px; margin-top: 8px; }
  .big.alt { background: var(--panel); color: var(--txt); border: 1px solid var(--line2); }
  .prop { display: flex; align-items: center; gap: 6px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
  .prop:last-child { border-bottom: 0; }
  .prop span { flex: 1; min-width: 0; font-weight: 600; }
  .prop small { color: var(--mut2); font-weight: 400; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .at { padding: 6px 0 6px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); text-align: center; min-width: 0; }
  .at small { display: block; font-size: 11px; color: var(--mut); }
  .at b { display: block; font-size: 22px; line-height: 1.15; color: var(--txt); }
  .at .base { font-size: 11px; color: var(--mut2); min-height: 14px; }
  .at.hurt { border-color: #d9524a; background: rgba(217,82,74,.14); }
  .at.hurt b { color: #ff8f86; }
  .at select { width: 52px; height: 26px; margin: 2px 0; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); text-align: center; }
  .wfb { display: flex; justify-content: center; gap: 5px; margin-top: 3px; }
  .wfb button { width: 18px; height: 18px; padding: 0; border: 2px solid var(--line2); border-radius: 4px; background: transparent; }
  .wfb button.on { background: #d9524a; border-color: #d9524a; }
  .wfb button:hover { border-color: #ff8f86; }
  .at.lk { display: flex; flex-direction: column; justify-content: center; }
  .trk { margin-bottom: 8px; }
  .trk .hd { display: flex; align-items: baseline; gap: 8px; margin-bottom: 3px; }
  .trk .nm { font-weight: 700; font-size: 13px; }
  .trk .vl { color: var(--mut); font-size: 12px; flex: 1; }
  .trk .lvb { font-size: 11px; font-weight: 800; padding: 1px 7px; border-radius: 9px; background: var(--acc); color: var(--onacc); }
  .trk .row { display: flex; align-items: center; gap: 4px; }
  .pips { display: flex; flex: 1; gap: 4px; flex-wrap: wrap; }
  .pip { position: relative; width: 28px; height: 28px; padding: 0; border-radius: 50%; border: 2px solid var(--c); background: transparent; }
  .pip.on { background: var(--c); }
  .pip .mk { position: absolute; left: 0; right: 0; bottom: -13px; font-size: 9px; font-weight: 800; color: var(--mut2); pointer-events: none; }
  .trk.mk { margin-bottom: 14px; }
  .pip.lim { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--c); }
  .pm { flex: none; width: 28px; height: 28px; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); font-size: 16px; line-height: 1; }
  .pm:hover { border-color: var(--line2); }
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .stp { padding: 5px 4px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); text-align: center; }
  .stp small { display: block; font-size: 11px; color: var(--mut); }
  .stp div { display: flex; align-items: center; justify-content: center; gap: 4px; }
  .stp b { min-width: 30px; font-size: 16px; color: var(--acc2); }
  .stp .pm { width: 24px; height: 24px; }
  .li { display: flex; align-items: center; gap: 6px; padding: 5px 9px; margin-bottom: 4px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); min-height: 30px; box-sizing: border-box; }
  .li span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .li b { color: var(--acc2); }
  .li input[type=text], .li input:not([type]) { flex: 1; min-width: 0; height: 28px; padding: 0 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
  .li select { height: 28px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); padding: 0 2px; }
  .li .x { flex: none; width: 26px; height: 26px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--mut); }
  .li.sm { display: block; }
  .add { width: 100%; padding: 6px; border: 1px dashed var(--line2); border-radius: 8px; background: transparent; color: var(--mut); font-size: 12px; font-weight: 700; }
  .add:hover { color: var(--txt); border-color: var(--acc); }
  .none { color: var(--mut2); font-size: 12px; padding: 2px 2px 6px; }
  .f { display: flex; flex-direction: column; gap: 3px; margin-bottom: 6px; font-size: 12px; color: var(--mut); }
  .f input, .f select, .f textarea { padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--txt); font-size: 14px; }
  .f textarea { min-height: 220px; resize: vertical; line-height: 1.4; }
  .f2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .log { display: flex; gap: 8px; padding: 5px 0; border-bottom: 1px dashed var(--line); font-size: 13px; align-items: baseline; }
  .log time { flex: none; color: var(--mut2); font-size: 11px; width: 38px; }
  .log span { flex: 1; min-width: 0; }
  .log em { font-style: normal; color: var(--mut2); font-size: 11px; }
  .hint { margin: 8px 0 0; font-size: 12px; line-height: 1.4; color: var(--mut); }
  textarea.raw { width: 100%; box-sizing: border-box; min-height: 120px; padding: 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); font-size: 11px; font-family: ui-monospace, monospace; }
  .tabs button { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sw { display: grid; grid-template-columns: 74px repeat(4, 1fr); gap: 4px; align-items: center; text-align: center; }
  .sw .hd { font-size: 11px; color: var(--mut2); font-weight: 700; }
  .sw .ty { text-align: left; font-size: 13px; font-weight: 700; }
  .sw .v { padding: 5px 0; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-size: 17px; font-weight: 800; color: var(--txt); }
  .sw .v.r { color: var(--acc2); }
  .gc { padding: 8px 10px; margin-bottom: 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
  .gc.eq { border-color: var(--acc); }
  .gc .gh { display: flex; align-items: center; gap: 8px; }
  .gc .gn { flex: 1; min-width: 0; font-size: 15px; font-weight: 800; overflow-wrap: anywhere; }
  .gc .gm { margin-top: 3px; font-size: 12px; color: var(--mut); overflow-wrap: anywhere; }
  .gc .ge { margin-top: 2px; font-size: 12px; color: var(--txt); opacity: .85; overflow-wrap: anywhere; }
  .hold { flex: none; padding: 5px 9px; border: 1px solid var(--line2); border-radius: 8px; background: var(--bg); color: var(--mut); font-size: 12px; font-weight: 700; }
  .hold.on { background: var(--acc); border-color: var(--acc); color: var(--onacc); }
  .dr { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12px; color: var(--mut); }
  .dpips { display: flex; gap: 5px; flex-wrap: wrap; }
  .dp { width: 22px; height: 22px; padding: 0; border: 2px solid var(--acc2); border-radius: 5px; background: transparent; }
  .dp.on { background: var(--acc2); }
  .rn { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 6px; }
  .rn div { padding: 4px 0; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); text-align: center; }
  .rn small { display: block; font-size: 11px; color: var(--mut); }
  .rn b { font-size: 18px; color: var(--txt); }
  .tg { display: flex; flex-wrap: wrap; gap: 4px; margin: 2px 0 6px; }
  .tg button { padding: 4px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--mut); font-size: 12px; font-weight: 700; }
  .tg button.on { background: var(--acc); border-color: var(--acc); color: var(--onacc); }
  .ml { display: block; margin: 6px 0 2px; font-size: 11px; color: var(--mut); }
  .mun { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .mun button { width: 24px; height: 24px; padding: 0; border: 2px solid var(--line2); border-radius: 5px; background: transparent; }
  .mun button.on { background: var(--mut2); border-color: var(--mut2); }
  .arm { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 8px; }
  .arl { display: flex; flex-direction: column; gap: 6px; }
  .rr { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--mut); }
  .rr b { min-width: 44px; padding: 4px 0; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); text-align: center; font-size: 17px; color: var(--txt); }
  .rr select { width: 70px; padding: 5px 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--txt); font-size: 14px; }
  .arr .ml { margin-top: 0; }
  .clrrow { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .clrrow .q { flex: 1; font-size: 13px; color: var(--txt); }
  .clrrow .btn.yes { border-color: #b83a3a; background: #7a1f24; color: #fff; }
  .pre { width: 100%; box-sizing: border-box; height: 34px; margin: 6px 0 4px; padding: 0 8px; border: 1px solid var(--line2); border-radius: 8px; background: var(--bg); color: var(--mut); font-size: 13px; }
  .f3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .bkrow { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
  .bkrow .big { margin-top: 0; padding: 9px 4px; font-size: 14px; }
  .empty { text-align: center; padding: 26px 8px 8px; color: var(--mut); line-height: 1.5; }
</style>
</head>
<body>
<div class="top">
  <select id="who" aria-label="Charakter"></select>
  <button class="ibtn" id="new" title="Neuen Charakter anlegen">+</button>
  <button class="ibtn" id="edit" title="Stammdaten bearbeiten" aria-label="Bearbeiten"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
</div>
<div id="msg"></div>
<div class="tabs" id="tabs"></div>
<div id="main"></div>

<script type="module">
import * as FA from "../fa-core.js";
const { ATTRS, ROMAN } = FA;
const $ = (id) => document.getElementById(id);
const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const lsGet = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch { /* ignorieren */ } };

// Design wie in der Würfel-Extension
if (window.FA_LOOKS) FA_LOOKS.follow(() => { try { return JSON.parse(lsGet("fa-dice3") || "{}").theme; } catch { return undefined; } });

let S = FA.readStore(), raw = lsGet(FA.STORE);
let tab = ["bogen", "fert", "gear", "notiz", "verlauf"].includes(lsGet("fa-char-tab")) ? lsGet("fa-char-tab") : "bogen";
let edit = false, pending = null, delArm = false, clrArm = false, importOpen = false, note = "";
const bk = { msg: "", text: "", pending: null, file: null }; // Sicherung: Meldung, Textfeld, gelesene Charaktere zum Bestätigen
// Beim Bearbeiten merken wir uns die Attribute von vorher. Beim Beenden geht eine Meldung an die SL, falls sich etwas geändert hat.
// "fresh" = der Charakter wurde gerade erst angelegt, dann ist das die normale Erstellung und es gibt keine Meldung.
let editBase = null;
const cur = () => FA.active(S);
const reload = () => { S = FA.readStore(); raw = lsGet(FA.STORE); };

// Alle Änderungen laufen über mut(): frisch lesen, ändern, bereinigen, schreiben, neu zeichnen
function mut(fn) {
  const out = { r: null };
  FA.update((s) => { out.r = fn(s); const cl = FA.cleanStore(s); s.chars = cl.chars; s.ci = cl.ci; s.q = cl.q; s.log = cl.log; s.ev = cl.ev; });
  reload(); render(); return out.r;
}
function startEdit(fresh) { const c = cur(); editBase = c ? { cid: c.id, a: c.a.slice(), fresh: !!fresh } : null; }
function flushEdit() {
  const b = editBase; editBase = null; if (!b || b.fresh) return;
  const c = S.chars.find((x) => x.id === b.cid); if (!c) return;
  const d = ATTRS.map((n, i) => (c.a[i] !== b.a[i] ? `${n} ${b.a[i]} → ${c.a[i]}` : "")).filter(Boolean);
  if (d.length) FA.update((s) => FA.selfEvent(s, b.cid, "Attribute geändert: " + d.join(", ")));
}
window.addEventListener("pagehide", flushEdit);
function change(ch, label) {
  const cid = S.ci;
  if (!label) label = editBase && editBase.fresh && editBase.cid === cid ? "Anlage" : "Spieler";
  const r = mut((s) => FA.commit(s, cid, ch, label));
  if (r && r.death) { pending = { reason: r.death, ch }; render(); }
  return r;
}
// Pip antippen: auf diesen Wert setzen, den obersten Pip nochmal antippen nimmt ihn wieder weg
const setTrack = (k, n, curv, min = 0) => change({ kind: k, set: curv === n ? Math.max(min, n - 1) : n });

// ---------- Kopf ----------
function paintTop() {
  const sel = $("who"); sel.textContent = "";
  S.chars.forEach((c) => { const o = h("option", "", (c.dead ? "† " : "") + (c.n || "Unbenannt")); o.value = c.id; sel.appendChild(o); });
  if (!S.chars.length) { const o = h("option", "", "Kein Charakter"); o.value = ""; sel.appendChild(o); }
  sel.value = S.ci; sel.disabled = !S.chars.length;
  $("new").disabled = S.chars.length >= FA.MAX.chars; $("edit").disabled = !cur(); $("edit").classList.toggle("on", edit && !!cur());
}
$("who").addEventListener("change", () => { const id = $("who").value; pending = null; delArm = false; clrArm = false; flushEdit(); mut((s) => { s.ci = id; }); if (edit) startEdit(false); });
$("new").addEventListener("click", () => { flushEdit(); mut((s) => { const c = FA.newChar("Neuer Charakter"); s.chars.push(c); s.ci = c.id; }); edit = true; startEdit(true); tab = "bogen"; render(); });
$("edit").addEventListener("click", () => { edit = !edit; if (edit) startEdit(false); else flushEdit(); render(); });

function paintTabs() {
  const t = $("tabs"); t.textContent = "";
  const c = cur(), np = c ? S.q.filter((p) => p.cid === c.id).length : 0;
  [["bogen", "Werte"], ["fert", "Fertigkeiten"], ["gear", "Ausrüstung"], ["notiz", "Notizen"], ["verlauf", "Verlauf"]].forEach(([k, n]) => {
    const b = h("button", k === tab ? "on" : "", n); b.type = "button";
    if (k === "bogen" && np) b.appendChild(h("i", "dot"));
    b.addEventListener("click", () => { tab = k; clrArm = false; delArm = false; lsSet("fa-char-tab", k); render(); });
    t.appendChild(b);
  });
}

// ---------- Hinweisleisten ----------
function paintMsg() {
  const box = $("msg"); box.textContent = ""; const c = cur();
  if (note) { const b = h("div", "bar info"); b.appendChild(h("span", "", note)); const x = h("button", "btn", "OK"); x.addEventListener("click", () => { note = ""; render(); }); b.appendChild(x); box.appendChild(b); }
  if (!c) return;
  if (pending) {
    const b = h("div", "bar"); b.appendChild(h("span", "", `${pending.reason}: Der Charakter würde sterben. Das wird nicht eingetragen, sondern der Charakter stirbt.`));
    const ok = h("button", "btn warn", "Er stirbt"); ok.addEventListener("click", () => { const p = pending; pending = null; if (p.pid) mut((s) => FA.acceptProposal(s, p.pid, true)); else change({ ...p.ch, force: true }); });
    const no = h("button", "btn", "Abbrechen"); no.addEventListener("click", () => { pending = null; render(); });
    b.appendChild(ok); b.appendChild(no); box.appendChild(b);
  }
  FA.alerts(c).forEach((a) => {
    const b = h("div", "bar"); b.appendChild(h("span", "", a.t));
    if (a.k === "dead") { const x = h("button", "btn", "Wiederbeleben"); x.title = "Falls das ein Irrtum war"; x.addEventListener("click", () => change({ kind: "revive" })); b.appendChild(x); }
    if (a.k === "ausbruch") { const x = h("button", "btn warn", "Ausbruch abwickeln"); x.title = "Brandmal +1, Korruption 0"; x.addEventListener("click", () => change({ kind: "ausbruch" })); b.appendChild(x); }
    box.appendChild(b);
  });
}

// ---------- Vorschläge ----------
function proposalBox(c) {
  const ps = S.q.filter((p) => p.cid === c.id); if (!ps.length) return null;
  const card = h("div", "card"); card.style.borderColor = "var(--acc)";
  card.appendChild(h("div", "sub", ps.length === 1 ? "Vorschlag zum Eintragen" : `${ps.length} Vorschläge zum Eintragen`));
  ps.forEach((p) => {
    const r = h("div", "prop"), t = h("span", "", FA.proposalText(c, p)); t.appendChild(h("small", "", "  von " + (p.src || "Würfel")));
    const ok = h("button", "btn go", "Eintragen"), no = h("button", "btn", "Ablehnen");
    ok.addEventListener("click", () => { const res = mut((s) => FA.acceptProposal(s, p.id)); if (res && res.death) { pending = { reason: res.death, pid: p.id }; render(); } });
    no.addEventListener("click", () => mut((s) => FA.rejectProposal(s, p.id)));
    r.appendChild(t); r.appendChild(ok); r.appendChild(no); card.appendChild(r);
  });
  return card;
}

// ---------- Bogen ----------
function trackRow(c, T) {
  const v = c.tr[T.k], wrap = h("div", "trk" + (T.lv ? " mk" : "")); wrap.style.setProperty("--c", T.col);
  const hd = h("div", "hd"); hd.appendChild(h("div", "nm", T.n));
  hd.appendChild(h("div", "vl", T.k === "corr" ? `${v} von ${FA.korrLimit(c)}` : `${v} von ${T.max}`));
  if (T.lv && FA.level(v) > 0) hd.appendChild(h("div", "lvb", "Stufe " + ROMAN[FA.level(v)]));
  wrap.appendChild(hd);
  const row = h("div", "row"), pips = h("div", "pips");
  const n = T.k === "corr" ? Math.min(24, Math.max(FA.korrLimit(c), v, 1)) : T.max;
  for (let i = 1; i <= n; i++) {
    const p = h("button", "pip" + (i <= v ? " on" : "") + (T.k === "corr" && i === FA.korrLimit(c) ? " lim" : "")); p.type = "button"; p.title = `${T.n} ${i}`;
    if (T.lv && (i === 3 || i === 5)) p.appendChild(h("span", "mk", i === 3 ? "I" : "II"));
    p.addEventListener("click", () => setTrack(T.k, i, v, T.min || 0)); pips.appendChild(p);
  }
  const mi = h("button", "pm", "-"), pl = h("button", "pm", "+"); mi.type = pl.type = "button"; mi.title = T.n + " senken"; pl.title = T.n + " erhöhen";
  mi.addEventListener("click", () => change({ kind: T.k, delta: -1 })); pl.addEventListener("click", () => change({ kind: T.k, delta: 1 }));
  row.appendChild(pips); row.appendChild(mi); row.appendChild(pl); wrap.appendChild(row); return wrap;
}
function field(label, input) { const l = h("label", "f", label); l.appendChild(input); return l; }
function textIn(val, max, onch) { const i = h("input"); i.type = "text"; i.maxLength = max; i.value = val; i.addEventListener("change", () => onch(i.value)); return i; }
function selectIn(opts, val, onch) { const s = h("select"); opts.forEach(([v, n]) => { const o = h("option", "", n); o.value = v; s.appendChild(o); }); s.value = val; s.addEventListener("change", () => onch(s.value)); return s; }
const setC = (fn) => mut((s) => { const c = FA.active(s); if (c) fn(c); });

function viewBogen(box, c) {
  const pb = proposalBox(c); if (pb) box.appendChild(pb);

    f2.appendChild(field("Facette", textIn(c.fac, 30, (v) => setC((x) => { x.fac = v; }))));
    f2.appendChild(field("Prägung", textIn(c.pra, 40, (v) => setC((x) => { x.pra = v; }))));
    f2.appendChild(field("Stufe", selectIn(Array.from({ length: 20 }, (_, i) => [i + 1, String(i + 1)]), c.tr.lvl, (v) => change({ kind: "lvl", set: +v }))));
    idc.appendChild(f2);
  } else {
    idc.appendChild(h("div", "who", c.n || "Unbenannt"));
    idc.appendChild(h("div", "sub", ["Stufe " + c.tr.lvl, FA.ART[c.t], FA.NATUREN[c.nat], c.fac, c.pra].filter(Boolean).join(" · ")));
  }

  box.appendChild(h("h2", "", "Attribute"));
  const g = h("div", "grid");

    const eff = FA.effAttr(c, i), wf = i < FA.WF_ATTRS ? c.wf[i] : 0, d = h("div", "at" + (wf ? " hurt" : "")); d.title = wf ? `${n}: Grundwert ${c.a[i]}, ${wf} Wundfolge${wf > 1 ? "n" : ""}` : n;
    d.appendChild(h("small", "", n));
    if (edit) { const s = selectIn([1, 2, 3, 4, 5, 6, 7].map((v) => [v, String(v)]), c.a[i], (v) => setC((x) => { x.a[i] = +v; })); d.appendChild(s); }
    else d.appendChild(h("b", "", String(eff)));
    d.appendChild(h("div", "base", edit ? "" : wf ? `Grundwert ${c.a[i]}` : ""));
    if (i < FA.WF_ATTRS) {
      const wb = h("div", "wfb");
      for (let j = 0; j < FA.WF_MAX; j++) {
        const b = h("button", j < wf ? "on" : ""); b.type = "button"; b.title = `Wundfolge ${j + 1} auf ${n}`;
        b.addEventListener("click", () => change({ kind: "wf", attr: i, set: j < wf ? j : j + 1 })); wb.appendChild(b);
      }
      d.appendChild(wb);
    } else { d.appendChild(h("div", "base", "keine Wundfolge")); }
    g.appendChild(d);
  });
  const lv = h("div", "at lk"); lv.appendChild(h("small", "", "Wundfolgen")); lv.appendChild(h("b", "", `${FA.wfTotal(c)}`)); lv.appendChild(h("div", "base", "tot ab 5")); g.appendChild(lv);
  box.appendChild(g);

  box.appendChild(h("h2", "", "Zustand"));
  const T = [{ k: "fear", n: "Furcht", col: "#9b6fe0", max: 6, lv: true }, { k: "exh", n: "Erschöpfung", col: "#d4893c", max: 6, lv: true }];
  if (c.t !== "w") T.push({ k: "corr", n: "Korruption", col: "#2fb5c5" });
  if (c.t === "v") T.push({ k: "brand", n: "Brandmal", col: "#e0b035", max: 4, min: 1 });
  T.push({ k: "wounds", n: "Wunden", col: "#d9524a", max: 7 });
  T.forEach((t) => box.appendChild(trackRow(c, t)));
}

const AT_FULL = FA.AT_SHORT;
function dpips(cur, max, onset) { // verbleibende Haltbarkeit: ausgefüllt = noch da, oberstes ausgefülltes Kästchen nochmal antippen nimmt es weg
  const w = h("div", "dpips");
  for (let i = 1; i <= max; i++) { const b = h("button", "dp" + (i <= cur ? " on" : "")); b.type = "button"; b.title = `Haltbarkeit ${i}`; b.addEventListener("click", () => onset(cur === i ? i - 1 : i)); w.appendChild(b); }
  return w;
}
function durRow(label, cur, max, onset) {
  const r = h("div", "dr"); r.appendChild(h("span", "", label));
  if (!max) r.appendChild(h("span", "", "keine")); else { r.appendChild(dpips(cur, max, onset)); }
  return r;
}
function toggles(labels, sel, ontoggle) {
  const g = h("div", "tg");
  labels.forEach((n, i) => { const b = h("button", sel.includes(i) ? "on" : "", n); b.type = "button"; b.addEventListener("click", () => ontoggle(i)); g.appendChild(b); });
  return g;
}

const preset = (rows, onpick) => { const s = selectIn([["", "Aus der Tabelle wählen ..."], ...rows.map((r, i) => [i, r[0]])], "", (v) => { if (v !== "") onpick(+v); }); s.className = "pre"; s.setAttribute("aria-label", "Aus der Tabelle wählen"); return s; };
const holdBtn = (on, onclick, label = "In der Hand") => { const b = h("button", "hold" + (on ? " on" : ""), on ? label + " ✓" : label); b.type = "button"; b.addEventListener("click", onclick); return b; };

const ROM = [[1, "I"], [2, "II"], [3, "III"]];
// Liste mit Name und Wert; kind "r" Rang I-III, "n" Zahl 1-3, "s" nur Text
function listSec(box, title, c, key, kind, opt = {}) {
  box.appendChild(h("h2", "", title));
  const arr = c[key], max = FA.MAX[opt.max || key] || 12;
  if (!arr.length && !edit) box.appendChild(h("div", "none", opt.none || "keine"));
  arr.forEach((e, i) => {
    const li = h("div", "li"), nm = kind === "s" ? e : e.n, val = kind === "s" ? null : e[opt.f || (kind === "r" ? "r" : "v")];
    if (edit) {
      li.appendChild(textIn(nm, kind === "s" ? 80 : 40, (v) => setC((x) => { if (kind === "s") x[key][i] = v; else x[key][i].n = v; })));
      if (kind !== "s") li.appendChild(selectIn(ROM.map(([v, n]) => [v, kind === "n" ? String(v) : n]), val, (v) => setC((x) => { x[key][i][opt.f || (kind === "r" ? "r" : "v")] = +v; })));
      const x = h("button", "x", "×"); x.type = "button"; x.title = "Entfernen"; x.addEventListener("click", () => setC((cc) => { cc[key].splice(i, 1); })); li.appendChild(x);
    } else { li.appendChild(h("span", "", nm || "(ohne Name)")); if (kind !== "s") li.appendChild(h("b", "", kind === "n" ? String(val) : ROMAN[val])); }
    box.appendChild(li);

  if (edit && arr.length < max) { const a = h("button", "add", "+ hinzufügen"); a.type = "button"; a.addEventListener("click", () => setC((x) => { x[key].push(kind === "s" ? "" : kind === "n" ? { n: "", v: 1 } : { n: "", [opt.f || "r"]: 1 }); })); box.appendChild(a); }

// ---------- Sicherung: Datei und Text ----------
const BK_MAX = 400000;
const bkText = () => JSON.stringify({ app: "fading-age-char", fa: "char1", format: 1, saved: new Date().toISOString(), chars: S.chars }, null, 1);
function bkRead(text) {
  bk.pending = null;
  try {
    if (String(text).length > BK_MAX) throw new Error("zu groß");
    const d = JSON.parse(text), list = d && Array.isArray(d.chars) ? d.chars.slice(0, FA.MAX.chars) : [];
    if (!list.length || (d.fa !== "char1" && d.app !== "fading-age-char")) throw new Error("fremd");
    bk.pending = list.map((o) => FA.cleanChar(o)); // Kennungen bleiben, damit eine zweite Sicherung nichts doppelt anlegt
    bk.msg = `Gefunden: ${bk.pending.length === 1 ? "1 Charakter" : bk.pending.length + " Charaktere"} (${bk.pending.map((c) => c.n || "Unbenannt").join(", ")}). Gleiche Charaktere werden ersetzt, neue kommen dazu.`;
  } catch { bk.msg = "Das ist keine Sicherung der Charakter-Extension. Es wurde nichts geändert."; }
  render();
}
function bkApply() {
  const list = bk.pending; if (!list) return; let add = 0, rep = 0;
  mut((s) => {
    list.forEach((cc) => {
      const i = s.chars.findIndex((x) => x.id === cc.id);
      if (i >= 0) { s.chars[i] = cc; rep++; } else if (s.chars.length < FA.MAX.chars) { s.chars.push(cc); add++; } else return;
      FA.selfEvent(s, cc.id, "Charakter aus Sicherung geladen: " + (cc.n || "Unbenannt"));
    });
    if (!s.ci && s.chars.length) s.ci = s.chars[0].id;
  });
  bk.pending = null; bk.text = ""; importOpen = false; bk.msg = `Geladen: ${add} neu, ${rep} ersetzt.`; render();
}
function backupUI(box) {
  box.appendChild(h("p", "hint", "Sichere Deine Charaktere, zum Beispiel für ein anderes Gerät. Sie liegen sonst nur in diesem Browser."));
  const r1 = h("div", "bkrow"), file = h("button", "big", "Als Datei speichern"), copy = h("button", "big alt", "Text kopieren");
  file.disabled = copy.disabled = !S.chars.length;
  file.addEventListener("click", () => {
    try {
      const a = document.createElement("a"), d = new Date().toISOString().slice(0, 10);
      a.href = URL.createObjectURL(new Blob([bkText()], { type: "text/plain" })); a.download = `fading-age-charaktere-${d}.txt`;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      bk.msg = "Datei wird gespeichert. Falls nichts passiert, nimm \"Text kopieren\".";
    } catch { bk.msg = "Das Speichern als Datei geht hier nicht. Nimm \"Text kopieren\"."; }
    render();
  });
  copy.addEventListener("click", async () => {
    const t = bkText(); bk.text = t; let ok = false;
    try { await navigator.clipboard.writeText(t); ok = true; } catch { ok = false; }
    bk.msg = ok ? "Text kopiert. Füge ihn zum Beispiel in eine Notiz ein." : "Der Text steht im Feld. Markiere ihn und kopiere ihn von Hand.";
    render(); const ta = box.ownerDocument.getElementById("bk-text"); if (ta && !ok) { ta.focus(); ta.select(); }
  });
  r1.appendChild(file); r1.appendChild(copy); box.appendChild(r1);
  const r2 = h("div", "bkrow"), pick = h("button", "big alt", "Datei wählen"), load = h("button", "big alt", "Text laden"), fi = h("input");
  fi.type = "file"; fi.accept = ".txt,.json,text/plain,application/json"; fi.hidden = true;
  pick.addEventListener("click", () => { fi.value = ""; fi.click(); });
  fi.addEventListener("change", () => {
    const f = fi.files && fi.files[0]; if (!f) return;
    if (f.size > BK_MAX) { bk.msg = "Die Datei ist zu groß für eine Sicherung."; render(); return; }
    const r = new FileReader(); r.onload = () => bkRead(String(r.result)); r.onerror = () => { bk.msg = "Die Datei konnte nicht gelesen werden."; render(); }; r.readAsText(f);
  });
  load.addEventListener("click", () => { const tx = bk.text.trim(); if (!tx) { bk.msg = "Füge zuerst einen Sicherungstext in das Feld ein."; render(); return; } bkRead(tx); });
  r2.appendChild(pick); r2.appendChild(load); box.appendChild(r2); box.appendChild(fi);
  const ta = h("textarea", "raw"); ta.id = "bk-text"; ta.style.marginTop = "8px"; ta.spellcheck = false; ta.value = bk.text;
  ta.placeholder = "Hier steht der Sicherungstext. Zum Laden einen Text einfügen und auf \"Text laden\" tippen.";
  ta.addEventListener("input", () => { bk.text = ta.value; }); box.appendChild(ta);
  if (bk.msg) box.appendChild(h("p", "hint", bk.msg));
  if (bk.pending) {
    const bar = h("div", "bar info"); bar.style.marginTop = "8px"; bar.appendChild(h("span", "", "Übernehmen?"));
    const ok = h("button", "btn go", "Übernehmen"), no = h("button", "btn", "Abbrechen");
    ok.addEventListener("click", bkApply); no.addEventListener("click", () => { bk.pending = null; bk.msg = "Abgebrochen, nichts geändert."; render(); });
    bar.appendChild(ok); bar.appendChild(no); box.appendChild(bar);
  }
}

const hhmm = (t) => new Date(t).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
function legacyChars() { try { const d = JSON.parse(lsGet("fa-dice3") || "{}"); return Array.isArray(d.chars) ? d.chars : []; } catch { return []; } }
function importLegacy() {
  const old = legacyChars(); if (!old.length) return;
  let n = 0;
  mut((s) => { old.forEach((o) => { if (s.chars.length >= FA.MAX.chars) return; const c = FA.cleanChar({ ...o, id: "" }); c.id = FA.uid(); s.chars.push(c); n++; }); if (!s.ci && s.chars.length) s.ci = s.chars[0].id; });
  note = `${n} Charakter${n === 1 ? "" : "e"} aus der Würfel-Extension übernommen. Die Würfel-Extension nutzt ab jetzt den Charakterbogen (Modus Automatisch).`; render();
}
function viewVerlauf(box, c) {
  box.appendChild(h("h2", "", "Verlauf"));
  const mine = S.log.filter((e) => e.cid === c.id).slice().reverse();
  if (!mine.length) box.appendChild(h("div", "none", "Noch keine Änderungen."));
  mine.slice(0, 40).forEach((e, i) => {
    const r = h("div", "log"); r.appendChild(h("time", "", hhmm(e.t)));
    const sp = h("span", "", e.text); if (e.src) sp.appendChild(h("em", "", "  " + e.src)); r.appendChild(sp);
    if (i === 0) { const u = h("button", "btn", "Rückgängig"); u.addEventListener("click", () => mut((s) => FA.undoLast(s, c.id))); r.appendChild(u); }
    box.appendChild(r);
  });
  if (mine.length) { // Verlauf leeren: erst fragen, dann löschen
    const cr = h("div", "clrrow");
    if (!clrArm) { const b = h("button", "btn", "Verlauf löschen"); b.type = "button"; b.addEventListener("click", () => { clrArm = true; render(); }); cr.appendChild(b); }
    else {
      cr.appendChild(h("span", "q", "Verlauf wirklich löschen?"));
      const y = h("button", "btn yes", "Ja"), n = h("button", "btn", "Nein"); y.type = n.type = "button";
      y.addEventListener("click", () => { clrArm = false; mut((st) => { st.log = st.log.filter((e) => e.cid !== c.id); }); });
      n.addEventListener("click", () => { clrArm = false; render(); });
      cr.appendChild(y); cr.appendChild(n);
    }
    box.appendChild(cr);
  }
  box.appendChild(h("h2", "", "Daten"));
  const old = legacyChars();
  if (old.length) { const b = h("button", "big alt", `Aus der Würfel-Extension übernehmen (${old.length})`); b.addEventListener("click", importLegacy); box.appendChild(b); }
  backupUI(box);
  const del = h("button", "big alt", delArm ? `"${c.n || "Unbenannt"}" wirklich löschen?` : "Diesen Charakter löschen"); if (delArm) del.style.borderColor = "#b83a3a";
  del.addEventListener("click", () => { if (!delArm) { delArm = true; render(); return; } delArm = false; mut((s) => { s.chars = s.chars.filter((x) => x.id !== c.id); }); }); box.appendChild(del);
  box.appendChild(h("p", "hint", "Der Charakter liegt in diesem Browser. Für Gerätewechsel oder zur Sicherheit: Sicherung als Datei speichern und aufheben."));
}

// ---------- Leerer Zustand ----------
function viewEmpty(box) {
  const e = h("div", "empty"); e.appendChild(h("div", "", "Noch kein Charakter.")); box.appendChild(e);
  const b = h("button", "big", "Neuen Charakter anlegen"); b.addEventListener("click", () => $("new").click()); box.appendChild(b);
  const old = legacyChars();
  if (old.length) { const o = h("button", "big alt", `Aus der Würfel-Extension übernehmen (${old.length})`); o.addEventListener("click", importLegacy); box.appendChild(o); }
  const im = h("button", "big alt", "Sicherung laden"); im.addEventListener("click", () => { tab = "verlauf"; importOpen = true; render(); }); box.appendChild(im);
}

function render() {
  const keep = { y: window.scrollY };
  paintTop(); paintMsg();
  const box = $("main"); box.textContent = ""; const c = cur();
  if (!c) { $("tabs").textContent = ""; if (importOpen) { /* Ladefeld ohne Charakter */ const b = h("div"); viewImportOnly(b); box.appendChild(b); } else viewEmpty(box); return; }
  paintTabs();
  if (tab === "bogen") viewBogen(box, c); else if (tab === "fert") viewFert(box, c); else if (tab === "gear") viewGear(box, c); else if (tab === "notiz") viewNotiz(box, c); else viewVerlauf(box, c);
  window.scrollTo(0, keep.y);
}
function viewImportOnly(box) {
  backupUI(box);
  const back = h("button", "big alt", "Zurück"); back.addEventListener("click", () => { importOpen = false; bk.pending = null; render(); }); box.appendChild(back);
}

// Änderungen aus anderen Fenstern (Würfel, SL im Hintergrund) übernehmen, solange gerade nichts getippt wird
const typing = () => { const a = document.activeElement; return a && (a.tagName === "TEXTAREA" || (a.tagName === "INPUT" && a.type === "text")); };
const sync = () => { if (lsGet(FA.STORE) === raw) return; if (typing()) return; reload(); render(); };
window.addEventListener("storage", (e) => { if (e.key === FA.STORE || e.key === null) sync(); });
window.addEventListener("focus", sync);
setInterval(sync, 1500);
render();
</script>
