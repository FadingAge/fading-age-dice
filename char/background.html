<!doctype html>
<html>
  <body>
    <script type="module">
      import OBR from "https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3/+esm";
      import * as FA from "../fa-core.js";

      // Läuft im Hintergrund, auch bei geschlossenem Charakterbogen:
      // - schickt der SL eine Kurzfassung des Charakters (Attribute, Wundfolgen, Tracker)
      // - nimmt Furcht und Erschöpfung von der SL an und trägt sie ein
      // - nimmt Vorschläge der SL an (z. B. Wundfolge) und meldet neue Vorschläge im Bogen
      const CH = "de.fadingage.chars";
      OBR.onReady(async () => {
        const myId = await OBR.player.getId();
        let gm = (await OBR.player.getRole()) === "GM";
        OBR.player.onChange((p) => { gm = p.role === "GM"; });
        const myName = async () => FA.txt(await OBR.player.getName(), 24);

        let last = "";
        const share = async (force) => {
          try {
            if (gm || !FA.useAuto()) return; // im Modus Manuell teilt die Würfel-Extension den Charakter
            const c = FA.active(FA.readStore());
            const m = { type: "char", pid: myId, name: await myName(), c: c ? FA.slView(c) : null }, key = JSON.stringify(m);
            if (!force && key === last) return;
            last = key; await OBR.broadcast.sendMessage(CH, m, { destination: "ALL" });
          } catch { /* ignorieren */ }
        };
        const fromGM = async (connectionId) => {
          try { const p = (await OBR.party.getPlayers()).find((x) => x.connectionId === connectionId); return !!p && p.role === "GM"; } catch { return false; }
        };
        let lastQ = FA.readStore().q.length;
        const tell = (t) => OBR.notification.show(t, "DEFAULT").catch(() => {});

        OBR.broadcast.onMessage(CH, async (event) => {
          const m = event.data; if (!m || typeof m !== "object") return;
          if (m.type === "charreq") { share(true); return; }
          if ((m.type !== "cond" && m.type !== "prop") || gm || m.pid !== myId) return;
          if (!(await fromGM(event.connectionId))) return; // nur die SL darf Werte setzen
          const kind = String(m.kind || "");
          if (m.type === "cond") {
            if (kind !== "fear" && kind !== "exh") return;
            const ch = { kind }; if (m.set != null) ch.set = FA.clamp(m.set, 0, 6); else ch.delta = FA.clamp(m.delta, -6, 6);
            const r = FA.update((s) => { const c = FA.active(s); return c ? FA.commit(s, c.id, ch, "SL") : { ok: false }; });
            if (r.ok) tell("SL: " + r.text);
          } else {
            const ok = FA.update((s) => { const c = FA.active(s); return c ? FA.addProposal(s, { cid: c.id, kind, delta: m.delta, attr: m.attr, label: m.label, src: "SL" }) : false; });
            if (ok) { lastQ = FA.readStore().q.length; tell("Neuer Vorschlag der SL im Charakterbogen"); }
          }
          share(true); // Rückmeldung an die SL mit den neuen Werten
        });

        let tm = 0;
        window.addEventListener("storage", (e) => {
          if (e.key !== FA.STORE && e.key !== "fa-dice3" && e.key !== null) return;
          clearTimeout(tm);
          tm = setTimeout(() => {
            share(false);
            const n = FA.readStore().q.length;
            if (n > lastQ) tell("Neuer Vorschlag im Charakterbogen");
            lastQ = n;
          }, 500);
        });
        OBR.party.onChange(() => { clearTimeout(tm); tm = setTimeout(() => share(true), 800); });
        setTimeout(() => share(true), 1500);
      });
    </script>
  </body>
</html>
